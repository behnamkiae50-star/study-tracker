<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>مرور هوشمند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Vazirmatn','Tahoma',sans-serif;direction:rtl;height:100vh;overflow:hidden;display:flex;}
button{cursor:pointer;border:none;outline:none;font-family:inherit;}
input,select{font-family:inherit;direction:rtl;outline:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px;}
.grade-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;transition:transform 0.1s;}
.grade-btn:hover{transform:scale(1.06);}
.grade-btn:active{transform:scale(0.96);}
.nav-tab{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:500;transition:all 0.15s;}
.flash{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4ade80;color:#0c0c10;padding:9px 22px;border-radius:24px;font-weight:600;font-size:13px;animation:fu 2.2s ease forwards;z-index:999;}
@keyframes fu{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
#sidebar{width:220px;min-width:220px;display:flex;flex-direction:column;overflow:hidden;transition:width 0.25s,min-width 0.25s;flex-shrink:0;}
#sidebar.closed{width:0 !important;min-width:0 !important;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#content{flex:1;overflow-y:auto;padding:18px 20px;}
.color-dot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;padding:0;flex-shrink:0;cursor:pointer;}
.color-dot.selected{border-color:#fff;}
.icon-btn{width:32px;height:32px;border-radius:8px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:color 0.15s;flex-shrink:0;cursor:pointer;}
html{background:#0c0c10;}
.toggle-switch{width:42px;height:24px;border-radius:12px;position:relative;transition:background 0.2s;flex-shrink:0;border:none;cursor:pointer;}
.toggle-knob{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all 0.2s;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99;cursor:pointer;}
#overlay.visible{display:block;}
@media(max-width:600px){
  #sidebar{position:fixed;right:0;top:0;height:100vh;z-index:100;width:220px !important;min-width:220px !important;}
  #sidebar.closed{transform:translateX(100%);width:220px !important;min-width:220px !important;}
  #sidebar{transition:transform 0.25s;}
}

/* ── DARK ── */
.dark{background:#0c0c10;color:#e2e0da;}
.dark #sidebar{background:#0f0f14;border-left:1px solid #1e1e28;}
.dark #header{background:#0c0c10;border-bottom:1px solid #1e1e28;}
.dark .sidebar-item{color:#777;background:none;border:none;width:100%;text-align:right;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:background 0.15s;}
.dark .sidebar-item:hover{background:#1a1a24;}
.dark .sidebar-item.active{background:#1e1e2c;color:#e2e0da;}
.dark .topic-card{background:#161620;border:1px solid #222232;border-radius:12px;padding:14px 16px;transition:border-color 0.2s;}
.dark .topic-card:hover{border-color:#32324a;}
.dark .icon-btn{background:#161620;border:1px solid #222232;color:#555;}
.dark .icon-btn:hover{color:#a3e635;}
.dark .nav-tab-active{background:#e2e0da;color:#0c0c10;border:1px solid transparent;}
.dark .nav-tab-inactive{background:#161620;color:#666;border:1px solid #222232;}
.dark .text-input{background:#161620;border:1px solid #222232;color:#e2e0da;border-radius:10px;padding:12px 14px;font-size:14px;width:100%;}
.dark .text-input-sm{background:#16161e;border:1px solid #222232;color:#e2e0da;border-radius:8px;padding:8px 10px;font-size:12px;width:100%;}
.dark .card-panel{background:#161620;border:1px solid #222232;border-radius:12px;padding:16px;}
.dark .upcoming-row{background:#0f0f16;border:1px solid #1a1a24;border-radius:10px;padding:9px 14px;}
.dark .sub{color:#444;}
.dark .muted{color:#555;}
.dark .dashed-btn{background:none;border:1px dashed #282836;color:#444;width:100%;padding:8px 12px;border-radius:10px;font-size:12px;}
.dark .cancel-btn{background:#1a1a24;color:#555;border:none;padding:7px;border-radius:8px;font-size:12px;flex:1;}
.dark .grade-cancel-btn{background:none;border:1px solid #222232;color:#444;padding:7px 12px;border-radius:8px;font-size:12px;}
.dark .grade-action-btn{background:#0c0c10;border:1px solid #222232;color:#555;margin-top:10px;padding:7px 14px;border-radius:8px;font-size:12px;width:100%;}
.dark .del-btn{background:none;border:1px solid #282836;color:#555;width:100%;padding:7px;border-radius:8px;font-size:11px;}
.dark .del-btn:hover{border-color:#f87171;color:#f87171;}
.dark .sidebar-title{color:#e2e0da;}
.dark .empty-icon{color:#2a2a38;}
.dark .empty-title{color:#555;}
.dark .empty-sub{color:#2a2a38;}
.dark .section-label{color:#2a2a38;}
.dark .add-btn{background:#e2e0da;color:#0c0c10;padding:12px;border-radius:10px;font-size:14px;font-weight:600;width:100%;}
.dark .toggle-off-bg{background:#222232;}
.dark .notif-time-input{background:#0c0c10;border:1px solid #222232;color:#e2e0da;border-radius:8px;padding:6px 10px;font-size:13px;}

/* ── LIGHT ── */
.light{background:#f0ede8;color:#1c1c22;}
.light #sidebar{background:#e6e3de;border-left:1px solid #d0cdc8;}
.light #header{background:#f0ede8;border-bottom:1px solid #d0cdc8;}
.light .sidebar-item{color:#999;background:none;border:none;width:100%;text-align:right;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px;transition:background 0.15s;}
.light .sidebar-item:hover{background:#d8d5d0;}
.light .sidebar-item.active{background:#ccc9c4;color:#1c1c22;}
.light .topic-card{background:#faf9f6;border:1px solid #d8d5d0;border-radius:12px;padding:14px 16px;transition:border-color 0.2s;}
.light .topic-card:hover{border-color:#b8b5b0;}
.light .icon-btn{background:#faf9f6;border:1px solid #d0cdc8;color:#bbb;}
.light .icon-btn:hover{color:#555;}
.light .nav-tab-active{background:#1c1c22;color:#f0ede8;border:1px solid transparent;}
.light .nav-tab-inactive{background:#faf9f6;color:#aaa;border:1px solid #d0cdc8;}
.light .text-input{background:#faf9f6;border:1px solid #d0cdc8;color:#1c1c22;border-radius:10px;padding:12px 14px;font-size:14px;width:100%;}
.light .text-input-sm{background:#faf9f6;border:1px solid #d0cdc8;color:#1c1c22;border-radius:8px;padding:8px 10px;font-size:12px;width:100%;}
.light .card-panel{background:#faf9f6;border:1px solid #d8d5d0;border-radius:12px;padding:16px;}
.light .upcoming-row{background:#e6e3de;border:1px solid #d0cdc8;border-radius:10px;padding:9px 14px;}
.light .sub{color:#aaa;}
.light .muted{color:#888;}
.light .dashed-btn{background:none;border:1px dashed #ccc;color:#bbb;width:100%;padding:8px 12px;border-radius:10px;font-size:12px;}
.light .cancel-btn{background:#e0ddd8;color:#888;border:none;padding:7px;border-radius:8px;font-size:12px;flex:1;}
.light .grade-cancel-btn{background:none;border:1px solid #d0cdc8;color:#bbb;padding:7px 12px;border-radius:8px;font-size:12px;}
.light .grade-action-btn{background:#f0ede8;border:1px solid #d0cdc8;color:#aaa;margin-top:10px;padding:7px 14px;border-radius:8px;font-size:12px;width:100%;}
.light .del-btn{background:none;border:1px solid #d0cdc8;color:#bbb;width:100%;padding:7px;border-radius:8px;font-size:11px;}
.light .del-btn:hover{border-color:#f87171;color:#f87171;}
.light .sidebar-title{color:#1c1c22;}
.light .empty-icon{color:#ccc;}
.light .empty-title{color:#aaa;}
.light .empty-sub{color:#ccc;}
.light .section-label{color:#bbb;}
.light .add-btn{background:#1c1c22;color:#f0ede8;padding:12px;border-radius:10px;font-size:14px;font-weight:600;width:100%;}
.light .toggle-off-bg{background:#ccc;}
.light .notif-time-input{background:#faf9f6;border:1px solid #d0cdc8;color:#1c1c22;border-radius:8px;padding:6px 10px;font-size:13px;}
</style>
</head>
<body id="app-body" class="dark">

<div id="overlay" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div style="padding:20px 14px 12px;overflow-y:auto;flex:1;border-bottom:1px solid rgba(128,128,128,0.15);">
    <div class="sidebar-title" style="font-size:13px;font-weight:700;margin-bottom:14px;">درس‌ها</div>
    <div id="course-list"></div>
  </div>
  <div style="padding:10px 14px;">
    <button onclick="toggleAddCourse()" id="add-course-btn" class="dashed-btn">+ درس جدید</button>
    <div id="add-course-form" style="display:none;flex-direction:column;gap:8px;">
      <input id="new-course-name" placeholder="نام درس..." onkeydown="if(event.key==='Enter')addCourse()" class="text-input-sm"/>
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;" id="color-picker"></div>
      <div style="display:flex;gap:6px;">
        <button onclick="addCourse()" style="flex:1;background:#4ade80;color:#0c0c10;padding:7px;border-radius:8px;font-size:12px;font-weight:600;">ثبت</button>
        <button onclick="toggleAddCourse()" class="cancel-btn">لغو</button>
      </div>
    </div>
  </div>
  <div style="padding:0 14px;margin-bottom:14px;" id="delete-course-area"></div>
</div>

<div id="main">
  <div id="header" style="padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <button class="icon-btn" id="sidebar-btn" onclick="toggleSidebar()">☰</button>
    <div style="flex:1;min-width:0;">
      <div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="header-title">همه درس‌ها</div>
      <div class="sub" style="font-size:11px;margin-top:1px;" id="header-sub"></div>
    </div>
    <div style="display:flex;gap:5px;align-items:center;flex-shrink:0;">
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="تغییر تم"></button>
      <button class="icon-btn" onclick="exportData()" title="بکاپ">↓</button>
      <label class="icon-btn" style="cursor:pointer;" title="بارگذاری">↑<input type="file" accept=".json" onchange="importData(event)" style="display:none"/></label>
      <button class="nav-tab" id="tab-today" onclick="setView('today')">امروز</button>
      <button class="nav-tab" id="tab-all" onclick="setView('all')">همه</button>
      <button class="nav-tab" id="tab-add" onclick="setView('add')">+</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
const GRADE_CONFIG={A:{label:"A",color:"#4ade80",days:10,desc:"کامل + مثال"},Bplus:{label:"B+",color:"#a3e635",days:7,desc:"تقریباً کامل"},B:{label:"B",color:"#facc15",days:4,desc:"قابل توضیح، ناقص"},C:{label:"C",color:"#fb923c",days:2,desc:"مبهم"},D:{label:"D",color:"#f87171",days:1,desc:"فراموش شده"}};
const COLORS=["#818cf8","#f472b6","#34d399","#fb923c","#60a5fa","#a78bfa","#facc15","#2dd4bf"];
const SK="study-tracker-v2", PK="study-tracker-prefs";

function loadData(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{courses:[],topics:[]};}catch{return{courses:[],topics:[]};}}
function loadPrefs(){try{const r=localStorage.getItem(PK);return r?JSON.parse(r):{theme:'dark'};}catch{return{theme:'dark'};}}
function saveData(){localStorage.setItem(SK,JSON.stringify(S.data));}
function savePrefs(){localStorage.setItem(PK,JSON.stringify({theme:S.theme}));}
function today(){return new Date().toISOString().split("T")[0];}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().split("T")[0];}
function daysDiff(d){return Math.round((new Date(d)-new Date(today()))/(864e5));}

const S={
  data:loadData(),
  selectedCourse:"all",
  sidebarOpen:window.innerWidth>600,
  view:"today",
  grading:null,
  addCourseOpen:false,
  selColor:"#818cf8",
  notifOn:false,
  notifTime:"09:00",
  notifTimer:null,
  theme:loadPrefs().theme,
};

function applyTheme(){
  const b=document.getElementById('app-body');
  b.classList.remove('dark','light');
  b.classList.add(S.theme);
  document.getElementById('theme-btn').textContent=S.theme==='dark'?'☀':'🌙';
  savePrefs();
}

function toggleTheme(){
  S.theme=S.theme==='dark'?'light':'dark';
  applyTheme();
  updateTabs();
  renderSidebar();
  render();
}

function showFlash(msg){
  document.querySelectorAll('.flash').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='flash';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

// ── SIDEBAR TOGGLE: only this function touches open/closed ──
function isMobile(){return window.innerWidth<=600;}

function closeSidebar(){
  S.sidebarOpen=false;
  document.getElementById('sidebar').classList.add('closed');
  document.getElementById('overlay').classList.remove('visible');
}

function toggleSidebar(){
  S.sidebarOpen=!S.sidebarOpen;
  document.getElementById('sidebar').classList.toggle('closed',!S.sidebarOpen);
  if(isMobile()){
    document.getElementById('overlay').classList.toggle('visible', S.sidebarOpen);
  }
}

function updateTabs(){
  ['today','all','add'].forEach(id=>{
    const b=document.getElementById('tab-'+id);
    if(!b)return;
    b.className='nav-tab '+(id===S.view?'nav-tab-active':'nav-tab-inactive');
  });
}

function setView(v){S.view=v;updateTabs();render();}

function selectCourse(id){S.selectedCourse=id;renderSidebar();render();}

function toggleAddCourse(){
  S.addCourseOpen=!S.addCourseOpen;
  document.getElementById('add-course-btn').style.display=S.addCourseOpen?'none':'block';
  document.getElementById('add-course-form').style.display=S.addCourseOpen?'flex':'none';
  if(S.addCourseOpen){document.getElementById('new-course-name').focus();renderColorPicker();}
}

function renderColorPicker(){
  const el=document.getElementById('color-picker');
  el.innerHTML='<span style="font-size:11px;color:#888;margin-left:4px;">رنگ:</span>';
  COLORS.forEach(c=>{
    const b=document.createElement('button');
    b.className='color-dot'+(S.selColor===c?' selected':'');
    b.style.background=c;b.onclick=()=>{S.selColor=c;renderColorPicker();};
    el.appendChild(b);
  });
}

function addCourse(){
  const name=document.getElementById('new-course-name').value.trim();
  if(!name)return;
  S.data.courses.push({id:Date.now().toString(),name,color:S.selColor});
  saveData();
  document.getElementById('new-course-name').value='';
  S.addCourseOpen=false;
  document.getElementById('add-course-btn').style.display='block';
  document.getElementById('add-course-form').style.display='none';
  showFlash('درس اضافه شد');
  renderSidebar();
}

function deleteCourse(id){
  S.data.courses=S.data.courses.filter(c=>c.id!==id);
  S.data.topics=S.data.topics.filter(t=>t.courseId!==id);
  if(S.selectedCourse===id)S.selectedCourse='all';
  saveData();renderSidebar();render();
}

function addTopic(){
  const name=document.getElementById('new-topic-name').value.trim();
  const courseId=document.getElementById('new-topic-course').value;
  if(!name||!courseId)return;
  S.data.topics.push({id:Date.now().toString(),name,courseId,nextReview:today(),lastGrade:null,history:[],createdAt:today()});
  saveData();
  document.getElementById('new-topic-name').value='';
  showFlash('موضوع اضافه شد');render();
}

function applyGrade(topicId,grade){
  const cfg=GRADE_CONFIG[grade];
  S.data.topics=S.data.topics.map(t=>t.id!==topicId?t:{...t,lastGrade:grade,nextReview:addDays(today(),cfg.days),history:[...t.history,{date:today(),grade}]});
  S.grading=null;saveData();render();
}

function deleteTopic(id){S.data.topics=S.data.topics.filter(t=>t.id!==id);saveData();render();}
function startGrading(id){S.grading=id;render();}
function cancelGrading(){S.grading=null;render();}

function exportData(){
  const blob=new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='study-tracker-'+today()+'.json';a.click();
  URL.revokeObjectURL(url);showFlash('فایل ذخیره شد');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(p.courses&&p.topics){S.data=p;saveData();renderSidebar();render();showFlash('داده‌ها بارگذاری شدن');}
      else showFlash('فایل معتبر نیست');
    }catch{showFlash('خطا در خواندن فایل');}
  };
  reader.readAsText(file);e.target.value='';
}

function toggleNotif(){
  S.notifOn=!S.notifOn;
  if(S.notifOn){
    Notification.requestPermission();
    if(S.notifTimer)clearInterval(S.notifTimer);
    S.notifTimer=setInterval(()=>{
      const now=new Date();
      const hhmm=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
      if(hhmm===S.notifTime){
        const due=S.data.topics.filter(t=>t.nextReview<=today()).length;
        if(due>0&&Notification.permission==='granted')new Notification('مرور هوشمند',{body:due+' موضوع امروز منتظر مروره'});
      }
    },60000);
  }else{if(S.notifTimer)clearInterval(S.notifTimer);}
  render();
}

function topicCardHTML(topic,showNext){
  const cfg=topic.lastGrade?GRADE_CONFIG[topic.lastGrade]:null;
  const course=S.data.courses.find(c=>c.id===topic.courseId);
  const diff=daysDiff(topic.nextReview);
  const isGrading=S.grading===topic.id;
  const badge=cfg?`<span style="width:24px;height:17px;border-radius:5px;background:${cfg.color}22;border:1.5px solid ${cfg.color};display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${cfg.color};">${cfg.label}</span>`:'';
  const cBadge=course?`<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:${course.color}18;color:${course.color};">${course.name}</span>`:'';
  let meta='';
  if(showNext){
    let t=diff<0?`<span style="color:#f87171">${Math.abs(diff)} روز تأخیر</span>`:diff===0?`<span style="color:#facc15">امروز</span>`:`${diff} روز دیگه`;
    if(topic.history.length>0)t+=` <span class="sub">· ${topic.history.length} مرور</span>`;
    meta=`<div class="sub" style="font-size:11px;margin-top:5px;">${t}</div>`;
  }else if(topic.history.length>0){
    meta=`<div class="sub" style="font-size:11px;margin-top:4px;">${topic.history.length} بار مرور</div>`;
  }
  let actions='';
  if(!isGrading){
    actions=`<button class="grade-action-btn" onclick="startGrading('${topic.id}')">ثبت نمره</button>`;
  }else{
    const btns=Object.entries(GRADE_CONFIG).map(([g,c])=>`<button class="grade-btn" onclick="applyGrade('${topic.id}','${g}')" style="background:${c.color}18;border:1.5px solid ${c.color};color:${c.color};">${c.label}</button>`).join('');
    actions=`<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">${btns}<button class="grade-cancel-btn" onclick="cancelGrading()">لغو</button></div>`;
  }
  return `<div class="topic-card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div style="flex:1;"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${badge}<span style="font-size:14px;font-weight:500;">${topic.name}</span>${cBadge}</div>${meta}</div>
      <button onclick="deleteTopic('${topic.id}')" class="sub" style="background:none;border:none;font-size:18px;padding:0 4px;line-height:1;" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color=''">×</button>
    </div>${actions}
  </div>`;
}

// renderSidebar NEVER touches sidebar open/closed state
function renderSidebar(){
  const {courses,topics}=S.data;
  const allDue=topics.filter(t=>t.nextReview<=today()).length;
  let html=`<button class="sidebar-item${S.selectedCourse==='all'?' active':''}" onclick="selectCourse('all')">
    <span style="width:8px;height:8px;border-radius:50%;background:#888;flex-shrink:0;"></span>
    <span>همه</span>
    <span class="sub" style="margin-right:auto;font-size:11px;">${allDue||''}</span>
  </button>`;
  courses.forEach(c=>{
    const due=topics.filter(t=>t.courseId===c.id&&t.nextReview<=today()).length;
    const badge=due?`<span style="font-size:10px;background:${c.color}22;color:${c.color};padding:1px 6px;border-radius:10px;">${due}</span>`:'';
    html+=`<button class="sidebar-item${S.selectedCourse===c.id?' active':''}" onclick="selectCourse('${c.id}')">
      <span style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0;"></span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.name}</span>${badge}
    </button>`;
  });
  document.getElementById('course-list').innerHTML=html;
  const da=document.getElementById('delete-course-area');
  da.innerHTML=S.selectedCourse!=='all'?`<button class="del-btn" onclick="deleteCourse('${S.selectedCourse}')">حذف این درس</button>`:'';
}

function render(){
  const {courses,topics}=S.data;
  const filtered=S.selectedCourse==='all'?topics:topics.filter(t=>t.courseId===S.selectedCourse);
  const due=filtered.filter(t=>t.nextReview<=today());
  const upcoming=filtered.filter(t=>t.nextReview>today()).sort((a,b)=>a.nextReview.localeCompare(b.nextReview));
  const cname=S.selectedCourse==='all'?'همه درس‌ها':(courses.find(c=>c.id===S.selectedCourse)?.name??'');
  document.getElementById('header-title').textContent=cname;
  document.getElementById('header-sub').textContent=`${due.length} امروز · ${filtered.length} کل`;
  document.getElementById('tab-today').textContent=`امروز (${due.length})`;
  const el=document.getElementById('content');

  if(S.view==='today'){
    let h='';
    if(!due.length){
      const nx=upcoming[0];
      h=`<div style="text-align:center;padding:60px 20px;">
        <div class="empty-icon" style="font-size:36px;margin-bottom:10px;">✓</div>
        <div class="empty-title" style="font-size:15px;font-weight:500;">برای امروز تمومه</div>
        ${nx?`<div class="empty-sub" style="font-size:12px;margin-top:6px;">بعدی: ${nx.nextReview}</div>`:''}
      </div>`;
    }else{
      h=`<div style="display:flex;flex-direction:column;gap:10px;">${due.map(t=>topicCardHTML(t,false)).join('')}</div>`;
    }
    if(upcoming.length){
      const rows=upcoming.slice(0,6).map(t=>{
        const d=daysDiff(t.nextReview);
        const cfg=t.lastGrade?GRADE_CONFIG[t.lastGrade]:null;
        const c=courses.find(x=>x.id===t.courseId);
        return `<div class="upcoming-row" style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:8px;">
            ${cfg?`<span style="width:7px;height:7px;border-radius:50%;background:${cfg.color};flex-shrink:0;"></span>`:''}
            <span style="font-size:13px;">${t.name}</span>
            ${c?`<span style="font-size:10px;color:${c.color};opacity:0.7;">${c.name}</span>`:''}
          </div>
          <span class="section-label" style="font-size:11px;">${d===1?'فردا':d+' روز دیگه'}</span>
        </div>`;
      }).join('');
      h+=`<div style="margin-top:28px;"><div class="section-label" style="font-size:11px;margin-bottom:10px;font-weight:600;letter-spacing:.3px;">پیش‌رو</div><div style="display:flex;flex-direction:column;gap:7px;">${rows}</div></div>`;
    }
    el.innerHTML=h;
  }
  else if(S.view==='all'){
    el.innerHTML=!filtered.length
      ?`<div style="text-align:center;padding:60px 20px;" class="empty-title">موضوعی اضافه نشده</div>`
      :`<div style="display:flex;flex-direction:column;gap:8px;">${[...filtered].sort((a,b)=>a.nextReview.localeCompare(b.nextReview)).map(t=>topicCardHTML(t,true)).join('')}</div>`;
  }
  else if(S.view==='add'){
    const opts=courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    const warn=!courses.length?`<div style="border:1px solid #f87171;border-radius:10px;padding:14px;font-size:13px;color:#f87171;margin-bottom:16px;">اول یه درس از سایدبار اضافه کن</div>`:'';
    const form=courses.length?`<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
      <input id="new-topic-name" placeholder="نام موضوع..." onkeydown="if(event.key==='Enter')addTopic()" class="text-input"/>
      <select id="new-topic-course" class="text-input" style="font-size:13px;"><option value="" disabled selected>انتخاب درس...</option>${opts}</select>
      <button onclick="addTopic()" class="add-btn">اضافه کردن</button>
    </div>`:'';
    const kpos=S.notifOn?'right:3px':'left:3px';
    const tInput=S.notifOn?`<div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
      <span class="muted" style="font-size:12px;">ساعت:</span>
      <input type="time" value="${S.notifTime}" onchange="S.notifTime=this.value" class="notif-time-input"/>
      <span class="sub" style="font-size:11px;">فقط وقتی اپ بازه</span>
    </div>`:'';
    const grades=Object.entries(GRADE_CONFIG).map(([g,c])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <span style="width:28px;height:20px;border-radius:6px;background:${c.color}22;border:1.5px solid ${c.color};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${c.color};flex-shrink:0;">${c.label}</span>
      <span class="muted" style="font-size:12px;">${c.desc}</span>
      <span class="sub" style="margin-right:auto;font-size:11px;">${c.days} روز</span>
    </div>`).join('');
    el.innerHTML=`<div style="max-width:480px;">
      <div class="muted" style="font-size:13px;margin-bottom:12px;font-weight:500;">موضوع جدید</div>
      ${warn}${form}
      <div class="card-panel" style="margin-bottom:12px;">
        <div class="muted" style="font-size:12px;margin-bottom:12px;font-weight:600;">اعلان روزانه</div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="muted" style="font-size:13px;">فعال‌سازی</span>
          <button class="toggle-switch ${S.notifOn?'':'toggle-off-bg'}" onclick="toggleNotif()" style="${S.notifOn?'background:#4ade80;':''}">
            <span class="toggle-knob" style="${kpos};"></span>
          </button>
        </div>${tInput}
      </div>
      <div class="card-panel">
        <div class="muted" style="font-size:12px;margin-bottom:12px;font-weight:600;">راهنمای نمره‌دهی</div>${grades}
      </div>
    </div>`;
  }
}

// ── INIT ──
applyTheme();
// Set initial sidebar state based on screen size
document.getElementById('sidebar').classList.toggle('closed', !S.sidebarOpen);
renderSidebar();
setView('today');
</script>
</body>
</html>
