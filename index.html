<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#111114"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111114'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='62'%3E🎓%3C/text%3E%3C/svg%3E"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111114'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='62'%3E🎓%3C/text%3E%3C/svg%3E"/>
<title>Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet"/>
<style>
@font-face{font-family:'Titr';src:url('https://cdn.jsdelivr.net/gh/rastikerdar/titr-font@v1.1/Titr.woff2') format('woff2');font-weight:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#111114;--bg2:#18181c;--bg3:#1e1e24;--bg4:#26262e;
  --border:#2e2e38;--border2:#3a3a46;
  --text:#f5f3ee;--text2:#c8c6d0;--text3:#7a7888;
  --accent:#3a3a44;--accent2:#4e4e5c;
  --green:#4ade80;--yellow:#facc15;--orange:#fb923c;--red:#f87171;--blue:#60a5fa;
  --charcoal:#3d3d4a;--charcoal2:#4a4a58;
  --base-size:18px;
}
body.light{
  --bg:#f2f0ec;--bg2:#e8e6e0;--bg3:#dedad2;--bg4:#d0cdc4;
  --border:#c4c0b8;--border2:#b0ada4;
  --text:#0e0d14;--text2:#2e2c3a;--text3:#6a6878;
  --accent:#dedad2;--accent2:#c8c5bc;
  --charcoal:#4a4a58;--charcoal2:#5a5a6a;
  --green:#16a34a;--yellow:#ca8a04;--orange:#ea580c;--red:#dc2626;--blue:#2563eb;
}
body.light #nch-name{background:#3a3a46;color:#ffffff;border-color:#5a5a6a;}
body.light #nch-name::placeholder{color:#aaaacc;}
body.light .gA{background:#16a34a22;border-color:#16a34a;color:#16a34a;}
body.light .gBplus{background:#65a30d22;border-color:#65a30d;color:#65a30d;}
body.light .gB{background:#ca8a0422;border-color:#ca8a04;color:#ca8a04;}
body.light .gC{background:#ea580c22;border-color:#ea580c;color:#ea580c;}
body.light .gD{background:#dc262622;border-color:#dc2626;color:#dc2626;}
body.light .imp-med{background:#1d4ed822;color:#1d4ed8;border-color:#1d4ed866;}
body.light .imp-high{background:#ea580c22;color:#ea580c;border-color:#ea580c66;}
body.light .imp-critical{background:#dc262622;color:#dc2626;border-color:#dc262666;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Vazirmatn',sans-serif;direction:rtl;overflow:hidden;font-size:var(--base-size);}
button{cursor:pointer;border:none;outline:none;font-family:inherit;background:none;}
input,select,textarea{font-family:inherit;direction:rtl;outline:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* LAYOUT */
#app{height:100vh;overflow:hidden;display:flex;flex-direction:row;}
#app.app-hidden{display:none!important;}
#sidebar{width:240px;min-width:240px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:width 0.25s,min-width 0.25s;overflow:hidden;flex-shrink:0;}
#sidebar.closed{width:0;min-width:0;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg);}
#content{flex:1;overflow-y:auto;padding:18px;background:var(--bg);}

/* روی موبایل sidebar بصورت overlay */
@media(max-width:640px){
  #sidebar{position:fixed;top:0;right:0;bottom:0;z-index:45;transform:translateX(0);transition:transform 0.25s;}
  #sidebar.closed{width:240px;min-width:240px;transform:translateX(100%);}
}

/* SIDEBAR */
#sidebar-inner{display:flex;flex-direction:column;height:100%;min-width:240px;}
.sidebar-section{padding:10px 12px 4px;font-size:12px;font-weight:600;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;}
.sidebar-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:9px;cursor:pointer;font-size:15px;color:var(--text2);transition:all 0.15s;border:none;background:none;width:100%;text-align:right;margin:1px 0;}
.sidebar-item:hover{background:var(--bg3);color:var(--text);}
.sidebar-item.active{background:var(--bg4);color:var(--text);}
.sidebar-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sidebar-courses{flex:1;overflow-y:auto;padding:6px 8px;}
.sidebar-bottom{padding:8px;border-top:1px solid var(--border);}

/* CHAPTER ACCORDION */
.ch-header{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--text2);transition:all 0.15s;font-family:'Titr','Vazirmatn',sans-serif;}
.ch-header:hover{background:var(--bg3);color:var(--text);}
.ch-header.active{color:var(--text);}
.titr{font-family:'Titr','Vazirmatn',sans-serif;}
.ch-arrow{font-size:12px;transition:transform 0.2s;margin-right:auto;}
.ch-arrow.open{transform:rotate(90deg);}
.ch-topics{padding-right:20px;overflow:hidden;max-height:0;transition:max-height 0.25s ease;}
.ch-topics.open{max-height:999px;}
.ch-topic-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;font-size:14px;color:var(--text3);cursor:pointer;transition:all 0.15s;}
.ch-topic-item:hover{background:var(--bg3);color:var(--text2);}

/* HEADER */
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:18px;transition:all 0.15s;border:1px solid var(--border);background:var(--bg2);}
.icon-btn:hover{color:var(--text);border-color:var(--border2);}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color 0.15s;}
.card:hover{border-color:var(--border2);}

/* GRADE BADGE */
.gb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:17px;border-radius:5px;font-size:12px;font-weight:700;flex-shrink:0;}
.gA{background:#4ade8022;border:1.5px solid #4ade80;color:#4ade80;}
.gBplus{background:#a3e63522;border:1.5px solid #a3e635;color:#a3e635;}
.gB{background:#facc1522;border:1.5px solid #facc15;color:#facc15;}
.gC{background:#fb923c22;border:1.5px solid #fb923c;color:#fb923c;}
.gD{background:#f8717122;border:1.5px solid #f87171;color:#f87171;}
.gNone{background:var(--bg4);border:1.5px solid var(--border2);color:var(--text3);}

/* IMPORTANCE */
.imp{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;}
.imp-low{background:var(--bg4);color:var(--text3);border:1px solid var(--border2);}
.imp-med{background:#60a5fa18;color:#60a5fa;border:1px solid #60a5fa44;}
.imp-high{background:#fb923c18;color:#fb923c;border:1px solid #fb923c44;}
.imp-critical{background:#f8717118;color:#f87171;border:1px solid #f8717144;}

/* PROGRESS */
.pbar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.pfill{height:100%;border-radius:2px;transition:width 0.3s;}

/* STAT */
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.stat-n{font-size:28px;font-weight:800;line-height:1;color:var(--text);}
.stat-l{font-size:13px;color:var(--text3);margin-top:4px;}

/* GRADE BUTTONS */
.grade-btn{padding:7px 13px;border-radius:8px;font-size:14px;font-weight:600;transition:transform 0.1s;}
.grade-btn:active{transform:scale(0.95);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:50;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg2);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--text);}
.mi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:16px;}
.mi::placeholder{color:var(--text3);}
.btn-p{width:100%;background:var(--charcoal2);color:#ffffff;padding:12px;border-radius:8px;font-size:16px;font-weight:600;}
.btn-s{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:11px;border-radius:8px;font-size:16px;}
.btn-d{width:100%;background:#f8717118;border:1px solid #f87171;color:#f87171;padding:10px;border-radius:8px;font-size:15px;}

/* NOTE */
.note-ta{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:15px;resize:none;min-height:65px;line-height:1.5;}
.note-ta::placeholder{color:var(--text3);}

/* FLASH */
.flash{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#0a0a0f;padding:9px 22px;border-radius:24px;font-weight:700;font-size:15px;animation:fu 2s ease forwards;z-index:999;}
@keyframes fu{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* COLOR DOTS */
.cdot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform 0.1s;}
.cdot.sel{border-color:var(--text);transform:scale(1.2);}

/* OVERLAY for mobile */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;}
@media(max-width:640px){
  #sidebar{position:fixed;right:0;top:0;height:100%;z-index:45;transform:translateX(0);transition:transform 0.25s;}
  #sidebar.closed{transform:translateX(100%);width:240px;min-width:240px;}
  #overlay.visible{display:block;}
}
@media(min-width:641px){
  #content{max-width:720px;margin:0 auto;width:100%;}
}
</style>
</head>
<body>
<div id="app" class="app-hidden" style="flex-direction:row;height:100%">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-inner">
      <div style="padding:16px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:16px;font-weight:700;color:var(--text);">مرور هوشمند</span>
        <button class="icon-btn" onclick="closeSidebar()" style="width:28px;height:28px;font-size:16px;border:none;background:none;">✕</button>
      </div>
      <div style="padding:8px;">
        <button class="sidebar-item active" id="si-dashboard" onclick="goto('dashboard')">📊 داشبورد</button>
        <button class="sidebar-item" id="si-review" onclick="goto('review')">🔄 مرور امروز</button>
      </div>
      <div class="sidebar-section">دروس</div>
      <div class="sidebar-courses" id="sidebar-courses"></div>
      <div class="sidebar-bottom">
        <button class="sidebar-item" id="si-settings" onclick="goto('settings')" style="width:100%;">⚙️ تنظیمات</button>
        <button class="sidebar-item" onclick="doLogout()" style="width:100%;color:#f87171;margin-top:4px;">🚪 خروج از حساب</button>
      </div>
    </div>
  </div>

  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div id="main">
    <div id="header">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div style="flex:1;">
        <div style="font-size:17px;font-weight:700;color:var(--text);" id="h-title">داشبورد</div>
        <div style="font-size:13px;color:var(--text3);" id="h-sub"></div>
      </div>
      <button class="icon-btn" onclick="openSearch()" style="font-size:17px;">🔍</button>
      <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">☀</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- SEARCH MODAL -->
<div class="modal-bg" id="search-bg" onclick="if(event.target===this)closeSearch()">
  <div class="modal" id="search-inner"></div>
</div>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:none;position:fixed;inset:0;z-index:999;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:32px;">
  <div style="font-size:52px;margin-bottom:16px;">🎓</div>
  <div style="font-size:24px;font-weight:700;margin-bottom:6px;">Study Tracker</div>
  <div style="font-size:15px;color:var(--text3);margin-bottom:36px;">برای ادامه وارد شوید</div>
  <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;">
    <input id="login-user" class="mi" placeholder="نام کاربری" style="padding:13px 16px;font-size:17px;border-radius:12px;" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()"/>
    <input id="login-pass" class="mi" type="password" placeholder="رمز عبور" style="padding:13px 16px;font-size:17px;border-radius:12px;" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div id="login-err" style="display:none;color:#f87171;font-size:14px;text-align:center;">نام کاربری یا رمز عبور اشتباه است</div>
    <button onclick="doLogin()" class="btn-p" style="padding:14px;border-radius:12px;font-size:18px;font-weight:700;color:#fff;margin-top:4px;">ورود</button>
  </div>
</div>

<div id="due-banner" style="position:fixed;top:0;left:0;right:0;z-index:30;background:#fb923c;color:#0a0a0f;padding:10px 16px;font-size:15px;font-weight:600;display:none;align-items:center;gap:10px;">
  <span id="due-banner-text"></span>
  <button onclick="goto('review');hideBanner()" style="margin-right:auto;background:rgba(0,0,0,0.2);color:#0a0a0f;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700;">مرور الان</button>
  <button onclick="hideBanner()" style="font-size:20px;color:#0a0a0f;opacity:0.7;">✕</button>
</div>


<script>
// ── USERS ─────────────────────────────────────────────────────────────────────
const USERS=[
  {username:'user1', password:'pass1'},
  {username:'user2', password:'pass2'},
  {username:'user3', password:'pass3'},
];

// ── SESSION ───────────────────────────────────────────────────────────────────
function getSession(){try{return JSON.parse(sessionStorage.getItem('study-session'))||null;}catch{return null;}}
function setSession(u){sessionStorage.setItem('study-session',JSON.stringify({username:u}));}
function clearSession(){sessionStorage.removeItem('study-session');}

// ── DATA (per user) ───────────────────────────────────────────────────────────
const GC={A:{l:'A',color:'#4ade80',days:10,desc:'می‌توانم آموزش دهم'},Bplus:{l:'B+',color:'#a3e635',days:7,desc:'مسلط، چند نکته جزئی'},B:{l:'B',color:'#facc15',days:4,desc:'مفهوم را می‌دانم'},C:{l:'C',color:'#fb923c',days:2,desc:'آشنا، جزئیات کم'},D:{l:'D',color:'#f87171',days:1,desc:'فراموش کرده‌ام'}};
const IC={low:{l:'کم‌اهمیت',cls:'imp-low'},med:{l:'متوسط',cls:'imp-med'},high:{l:'مهم',cls:'imp-high'},critical:{l:'بسیار مهم',cls:'imp-critical'}};
const COLORS=['#6b7280','#3d9970','#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'];

let currentUser=null;
let SK='',PK='';

function userSK(u){return'study-v3-'+u;}
function userPK(u){return'study-v3-prefs-'+u;}

function ld(){try{const r=localStorage.getItem(SK);const d=r?JSON.parse(r):{courses:[],chapters:[],topics:[]};if(!d.subtopics)d.subtopics=[];return d;}catch{return{courses:[],chapters:[],topics:[],subtopics:[]};}}
function sd(){localStorage.setItem(SK,JSON.stringify(D));}
function lp(){try{const r=localStorage.getItem(PK);return r?JSON.parse(r):{theme:'dark'};}catch{return{theme:'dark'};}}
function sp(){localStorage.setItem(PK,JSON.stringify({theme:P.theme}));}

let D={courses:[],chapters:[],topics:[],subtopics:[]};
let P={theme:'dark'};

// ── STATE ─────────────────────────────────────────────────────────────────────
let page='dashboard';
let gradingId=null;
let editingCourseId=null;
let editingChapterId=null;
let openChapters={};
let openTopics={};
let chapterDragMode={};
let dragSrcChId=null;
let topicDragChId=null;
let dragSrcTopId=null;
let dragOverTopId=null;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().split('T')[0];}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().split('T')[0];}
function daysDiff(d){return Math.round((new Date(d)-new Date(today()))/(864e5));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function gs(g){return{A:100,Bplus:85,B:65,C:40,D:10}[g]??0;}
function stReady(s){if(!s.history.length)return null;const l=s.history.slice(-5);return Math.round(l.reduce((a,h)=>a+gs(h.grade),0)/l.length);}
function tReady(t){
  const subs=getSubtopics(t.id);
  if(subs.length){const sc=subs.filter(s=>s.history.length).map(s=>stReady(s)).filter(x=>x!==null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;}
  if(!t.history.length)return null;
  const l=t.history.slice(-5);return Math.round(l.reduce((s,h)=>s+gs(h.grade),0)/l.length);
}
function cReady(chId){const ts=D.topics.filter(t=>t.chapterId===chId);if(!ts.length)return null;const sc=ts.map(t=>tReady(t)).filter(x=>x!==null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;}
function crsReady(cId){const chs=D.chapters.filter(c=>c.courseId===cId);const sc=chs.map(c=>cReady(c.id)).filter(x=>x!==null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;}
function rc(r){
  if(r===null)return'var(--text3)';
  const light=document.body.classList.contains('light');
  if(r>=80)return light?'#15803d':'#4ade80';
  if(r>=60)return light?'#4d7c0f':'#a3e635';
  if(r>=40)return light?'#a16207':'#facc15';
  if(r>=20)return light?'#c2410c':'#fb923c';
  return light?'#b91c1c':'#f87171';
}
function getCh(t){return D.chapters.find(c=>c.id===t.chapterId);}
function getCrs(t){const ch=getCh(t);return ch?D.courses.find(c=>c.id===ch.courseId):null;}
function getSubtopics(topicId){return(D.subtopics||[]).filter(s=>s.topicId===topicId);}
function hasSubtopics(topicId){return getSubtopics(topicId).length>0;}
function gb(g){if(!g)return`<span class="gb gNone">—</span>`;const k=g.replace('+','plus');return`<span class="gb g${k}">${GC[g]?.l??g}</span>`;}
function ib(i){if(!i)return'';return`<span class="imp ${IC[i].cls}">${IC[i].l}</span>`;}
function flash(msg,color){document.querySelectorAll('.flash').forEach(e=>e.remove());const el=document.createElement('div');el.className='flash';el.textContent=msg;if(color)el.style.background=color;document.body.appendChild(el);setTimeout(()=>el.remove(),2300);}
function relDate(d){if(!d||d==='—')return'—';const diff=daysDiff(d);if(diff===0)return'امروز';if(diff<0)return Math.abs(diff)+' روز پیش';return diff+' روز دیگر';}

// ── THEME ─────────────────────────────────────────────────────────────────────
function applyTheme(){document.body.classList.toggle('light',P.theme==='light');const b=document.getElementById('theme-btn');if(b)b.textContent=P.theme==='dark'?'☀':'🌙';}
function toggleTheme(){P.theme=P.theme==='dark'?'light':'dark';applyTheme();sp();}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
let sidebarOpen=window.innerWidth>640;
function isMobile(){return window.innerWidth<=640;}
function toggleSidebar(){sidebarOpen=!sidebarOpen;applySidebar();}
function closeSidebar(){sidebarOpen=false;applySidebar();}
function applySidebar(){
  document.getElementById('sidebar').classList.toggle('closed',!sidebarOpen);
  if(isMobile())document.getElementById('overlay').classList.toggle('visible',sidebarOpen);
}

function renderSidebar(){
  const el=document.getElementById('sidebar-courses');
  let html='';
  D.courses.forEach(c=>{
    const chs=D.chapters.filter(ch=>ch.courseId===c.id);
    const chIds=new Set(chs.map(ch=>ch.id));
    const due=reviewableItems().filter(item=>chIds.has(item.t.chapterId)).length;
    html+=`<button class="sidebar-item" onclick="goto('course:${c.id}')" id="si-course-${c.id}">
      <span class="dot" style="background:${c.color};"></span>
      <span style="flex:1;">${c.name}</span>
      ${due>0?`<span style="font-size:13px;font-weight:700;background:${c.color}22;color:${c.color};padding:2px 7px;border-radius:10px;">${due}</span>`:''}
    </button>`;
  });
  html+=`<button class="sidebar-item" onclick="openAddCourse()" style="color:var(--text3);margin-top:4px;">+ درس جدید</button>`;
  el.innerHTML=html;
  updateSidebarActive();
}

function toggleChapter(id){openChapters[id]=!openChapters[id];renderSidebar();}

function updateSidebarActive(){
  document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.remove('active'));
  const active=document.getElementById('si-'+page.replace(':','-').replace('course-','course-'));
  if(active)active.classList.add('active');
  if(page.startsWith('course:')){
    const id=page.split(':')[1];
    const el=document.getElementById('si-course-'+id);
    if(el)el.classList.add('active');
  }
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
const TITLES={dashboard:'داشبورد',review:'مرور امروز',settings:'تنظیمات'};
function goto(p){
  page=p;gradingId=null;editingCourseId=null;editingChapterId=null;
  const title=p.startsWith('course:')?D.courses.find(c=>c.id===p.split(':')[1])?.name??'':TITLES[p]??'';
  document.getElementById('h-title').textContent=title;
  const due=reviewableItems().length;
  document.getElementById('h-sub').textContent=due>0?`${due} موضوع برای مرور`:'';
  updateSidebarActive();
  if(isMobile())closeSidebar();
  render();
}

function scrollToTopic(id){
  goto('review');
  setTimeout(()=>{const el=document.getElementById('t-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},200);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const c=document.getElementById('content');
  if(page==='dashboard')c.innerHTML=renderDashboard();
  else if(page==='review')c.innerHTML=renderReview();
  else if(page==='settings')c.innerHTML=renderSettings();
  else if(page.startsWith('course:'))c.innerHTML=renderCourse(page.split(':')[1]);
  renderSidebar();
  showBanner();
  renderFab();
}
function renderFab(){
  let fab=document.getElementById('fab-add-chapter');
  if(page.startsWith('course:')){
    const cId=page.split(':')[1];
    const isDragMode=!!chapterDragMode[cId];
    if(!fab){
      fab=document.createElement('button');
      fab.id='fab-add-chapter';
      fab.style.cssText='position:fixed;left:20px;bottom:28px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.35);z-index:900;transition:transform 0.15s,opacity 0.15s;';
      document.body.appendChild(fab);
    }
    const col=D.courses.find(x=>x.id===cId)?.color||'var(--blue)';
    fab.style.background=col;
    fab.style.opacity=isDragMode?'0':'1';
    fab.style.pointerEvents=isDragMode?'none':'auto';
    fab.style.transform=isDragMode?'scale(0.7)':'scale(1)';
    fab.onclick=()=>openAddChapter(cId);
    fab.innerHTML='<span style="line-height:1;margin-top:-2px;">+</span>';

    if(fab)fab.remove();
  }
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderOverallChart(){
  // جمع‌آوری همه history از topics و subtopics
  const allHistory=[];
  D.topics.forEach(t=>{
    t.history.forEach(h=>allHistory.push({date:h.date,score:gs(h.grade)}));
    (D.subtopics||[]).filter(s=>s.topicId===t.id).forEach(s=>{
      s.history.forEach(h=>allHistory.push({date:h.date,score:gs(h.grade)}));
    });
  });
  if(allHistory.length<1)return'';

  const byDate={};
  allHistory.forEach(({date,score})=>{
    if(!byDate[date])byDate[date]={sum:0,count:0};
    byDate[date].sum+=score;byDate[date].count+=1;
  });
  const dates=Object.keys(byDate).sort();

  const points=dates.map(d=>({date:d,avg:Math.round(byDate[d].sum/byDate[d].count)}));
  const last=points[points.length-1];
  const isLight=document.body.classList.contains('light');

  // رنگ‌بندی
  const lineColor=last.avg>=75?(isLight?'#16a34a':'#22d3ee'):last.avg>=50?(isLight?'#d97706':'#fbbf24'):(isLight?'#dc2626':'#f87171');
  const gridColor=isLight?'rgba(0,0,0,0.07)':'rgba(255,255,255,0.06)';
  const labelColor=isLight?'#9998aa':'#6b6a7a';
  const axisColor=isLight?'rgba(0,0,0,0.12)':'rgba(255,255,255,0.1)';

  // ابعاد — padding کافی از همه طرف
  const W=300, H=140;
  const PL=38, PR=20, PT=20, PB=34;
  const iW=W-PL-PR, iH=H-PT-PB;

  const yPos=v=>PT+iH-((v/100)*iH);
  // اگر فقط یک نقطه داریم، وسط بگذار؛ وگرنه spread کن
  const xPos=i=>points.length===1?PL+iW/2:PL+i*(iW/(points.length-1));

  // مسیر خط و fill
  const pathD=points.map((p,i)=>`${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(p.avg).toFixed(1)}`).join(' ');
  const fillD=points.length>1
    ?pathD+` L${xPos(points.length-1).toFixed(1)},${(PT+iH).toFixed(1)} L${xPos(0).toFixed(1)},${(PT+iH).toFixed(1)} Z`
    :'';

  const lastX=xPos(points.length-1);
  const lastY=yPos(last.avg);

  // برچسب آخر: بالا یا پایین بسته به فضا
  const labelAbove=lastY>PT+26;
  const labelY=labelAbove?lastY-14:lastY+26;

  // تاریخ‌ها — فقط اول و آخر (اگر متفاوت)
  const fmt=d=>{const p=d.split('-');return`${p[1]}/${p[2]}`;};
  const showBothDates=points.length>1&&dates[0]!==dates[dates.length-1];

  // خطوط grid — فقط ۲۵، ۵۰، ۷۵
  const gridLines=[25,50,75];

  return`<div style="margin-top:20px;">
    <div style="font-size:13px;font-weight:600;color:var(--text3);margin-bottom:8px;text-align:right;letter-spacing:0.3px;">روند آمادگی کلی</div>
    <div class="card" style="padding:14px 12px 10px;background:var(--bg2);overflow:hidden;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" style="display:block;overflow:hidden;">
        <defs>
          <linearGradient id="cFill2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="${lineColor}" stop-opacity="0.01"/>
          </linearGradient>
          <clipPath id="cClip2">
            <rect x="${PL}" y="${PT}" width="${iW}" height="${iH}"/>
          </clipPath>
        </defs>

        <!-- محور Y و X -->
        <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+iH}" stroke="${axisColor}" stroke-width="1"/>
        <line x1="${PL}" y1="${PT+iH}" x2="${PL+iW}" y2="${PT+iH}" stroke="${axisColor}" stroke-width="1"/>

        <!-- خطوط grid افقی -->
        ${gridLines.map(v=>{
          const y=yPos(v);
          return`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${PL+iW}" y2="${y.toFixed(1)}" stroke="${gridColor}" stroke-width="0.8" stroke-dasharray="3,4"/>
          <text x="${(PL-5).toFixed(1)}" y="${(y+3.5).toFixed(1)}" font-size="8.5" fill="${labelColor}" text-anchor="end" font-family="Vazirmatn,sans-serif">${v}</text>`;
        }).join('')}
        <!-- برچسب ۰ و ۱۰۰ -->
        <text x="${(PL-5).toFixed(1)}" y="${(yPos(0)+3.5).toFixed(1)}" font-size="8.5" fill="${labelColor}" text-anchor="end" font-family="Vazirmatn,sans-serif">0</text>
        <text x="${(PL-5).toFixed(1)}" y="${(yPos(100)+3.5).toFixed(1)}" font-size="8.5" fill="${labelColor}" text-anchor="end" font-family="Vazirmatn,sans-serif">100</text>

        <!-- fill -->
        ${fillD?`<path d="${fillD}" fill="url(#cFill2)" clip-path="url(#cClip2)"/>`:''}

        <!-- خط اصلی -->
        ${points.length>1?`<path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#cClip2)"/>`:''}

        <!-- نقاط -->
        ${points.length<=16?points.map((p,i)=>{
          const cx=xPos(i).toFixed(1);
          const cy=yPos(p.avg).toFixed(1);
          return`<circle cx="${cx}" cy="${cy}" r="${i===points.length-1?'4.5':'2.2'}" fill="${lineColor}" stroke="var(--bg2)" stroke-width="${i===points.length-1?'2':'1'}" opacity="${i===points.length-1?'1':'0.65'}"/>`;
        }).join(''):''}

        <!-- برچسب درصد روی آخرین نقطه -->
        <rect x="${(lastX-17).toFixed(1)}" y="${(labelY-11).toFixed(1)}" width="34" height="15" rx="4" fill="${lineColor}" opacity="0.92"/>
        <text x="${lastX.toFixed(1)}" y="${(labelY).toFixed(1)}" font-size="9" fill="${isLight?'#fff':'#0a0a0f'}" text-anchor="middle" font-weight="700" font-family="Vazirmatn,sans-serif">${last.avg}%</text>
        <!-- خط اتصال برچسب به نقطه -->
        ${labelAbove?`<line x1="${lastX.toFixed(1)}" y1="${(lastY-5).toFixed(1)}" x2="${lastX.toFixed(1)}" y2="${(labelY-12).toFixed(1)}" stroke="${lineColor}" stroke-width="1" opacity="0.5"/>`
        :`<line x1="${lastX.toFixed(1)}" y1="${(lastY+5).toFixed(1)}" x2="${lastX.toFixed(1)}" y2="${(labelY-12).toFixed(1)}" stroke="${lineColor}" stroke-width="1" opacity="0.5"/>`}

        <!-- برچسب‌های تاریخ — فقط اول و آخر -->
        ${showBothDates?`
          <text x="${PL.toFixed(1)}" y="${H-4}" font-size="8.5" fill="${labelColor}" text-anchor="start" font-family="Vazirmatn,sans-serif">${fmt(dates[0])}</text>
          <text x="${(PL+iW).toFixed(1)}" y="${H-4}" font-size="8.5" fill="${labelColor}" text-anchor="end" font-family="Vazirmatn,sans-serif">${fmt(dates[dates.length-1])}</text>
        `:points.length===1?`
          <text x="${lastX.toFixed(1)}" y="${H-4}" font-size="8.5" fill="${labelColor}" text-anchor="middle" font-family="Vazirmatn,sans-serif">${fmt(dates[0])}</text>
        `:''}
      </svg>
    </div>
  </div>`;
}

function renderDashboard(){
  const due=reviewableItems();
  const overdue=due.filter(item=>item.type==='topic'?item.t.nextReview<today():item.s.nextReview<today());
  const allSc=D.topics.filter(t=>t.history.length||hasSubtopics(t.id)).map(t=>tReady(t)).filter(x=>x!==null);
  const overall=allSc.length?Math.round(allSc.reduce((a,b)=>a+b,0)/allSc.length):null;

  let html=`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px;padding:10px 0;">
    <div class="stat" style="width:100%;text-align:center;cursor:default;">
      <div class="stat-n" style="color:${rc(overall)};font-size:42px;">${overall!==null?overall+'%':'—'}</div>
      <div class="stat-l">آمادگی کلی</div>
    </div>
    <div style="display:flex;gap:12px;width:100%;">
      <div class="stat" style="flex:1;text-align:center;cursor:pointer;" onclick="goto('review')">
        <div class="stat-n" style="color:${due.length>0?rc(30):rc(100)}">${due.length}</div>
        <div class="stat-l">برای مرور</div>
      </div>
      <div class="stat" style="flex:1;text-align:center;cursor:pointer;" onclick="goto('review')">
        <div class="stat-n" style="color:${overdue.length>0?rc(0):'var(--text3)'}">${overdue.length}</div>
        <div class="stat-l">عقب‌افتاده</div>
      </div>
    </div>
  </div>`;

  if(due.length){
    html+=`<div style="font-size:17px;font-weight:600;color:var(--text3);margin-bottom:10px;letter-spacing:0.4px;">امروز چی مرور کنم</div>`;
    due.slice(0,6).forEach(item=>{
      const t=item.t;
      const name=item.type==='sub'?item.s.name:t.name;
      const grade=item.type==='sub'?item.s.lastGrade:t.lastGrade;
      const c=getCrs(t),ch=getCh(t);
      const diff=item.type==='sub'?daysDiff(item.s.nextReview):daysDiff(t.nextReview);
      html+=`<div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="goto('review')">
        <div style="display:flex;align-items:center;gap:10px;">
          ${gb(grade)}
          <div style="flex:1;min-width:0;">
            <div style="font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
            <div style="font-size:13px;color:var(--text3);margin-top:2px;">${c?c.name:''} ${ch?'/ '+ch.name:''} ${item.type==='sub'?'/ '+t.name:''}</div>
          </div>
          ${diff<0?`<span style="font-size:13px;color:#f87171;flex-shrink:0;">${Math.abs(diff)}روز تأخیر</span>`:`<span style="font-size:13px;color:#facc15;flex-shrink:0;">امروز</span>`}
        </div>
      </div>`;
    });
    if(due.length>6)html+=`<div style="text-align:center;font-size:14px;color:var(--text3);padding:8px;">و ${due.length-6} مورد دیگر...</div>`;
  }

  return html;
}

// ── COURSE PAGE ───────────────────────────────────────────────────────────────

function renderCourse(cId){
  const c=D.courses.find(x=>x.id===cId);if(!c)return'';
  const chs=D.chapters.filter(ch=>ch.courseId===cId);
  const r=crsReady(cId);
  const isCourseEditing=editingCourseId===cId;
  const isDragMode=!!chapterDragMode[cId];
  let html='';

  // Header
  html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">`;
  html+=`<span style="width:12px;height:12px;border-radius:50%;background:${c.color};flex-shrink:0;"></span>`;
  if(isCourseEditing){
    html+=`<input id="inline-course-${cId}" class="mi" value="${c.name.replace(/"/g,'&quot;')}" style="flex:1;padding:7px 10px;font-size:18px;font-weight:700;" onkeydown="if(event.key==='Enter')saveCourseInline('${cId}');if(event.key==='Escape')cancelCourseEdit();"/>`;
    html+=`<button onclick="saveCourseInline('${cId}')" style="padding:6px 12px;background:var(--charcoal2);color:#fff;border-radius:7px;font-size:14px;font-weight:600;">ذخیره</button>`;
    html+=`<button onclick="cancelCourseEdit()" style="padding:6px 10px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:7px;font-size:14px;">لغو</button>`;
    html+=`<button onclick="deleteCourse('${cId}')" style="padding:6px 10px;background:#f8717118;border:1px solid #f87171;color:#f87171;border-radius:7px;font-size:13px;">حذف</button>`;
  } else {
    html+=`<span style="font-size:18px;font-weight:700;flex:1;">${c.name}</span>`;
    html+=`${r!==null?'<span style="font-size:17px;font-weight:700;color:'+rc(r)+';margin-left:4px;">'+r+'%</span>':''}`;
    html+=`<button onclick="startCourseEdit('${cId}')" style="color:var(--text3);font-size:16px;">✏️</button>`;
  }
  html+=`</div>`;
  html+=`<div class="pbar" style="margin-bottom:14px;"><div class="pfill" style="width:${r??0}%;background:${rc(r)};"></div></div>`;

  if(!isCourseEditing){
    html+=`<div style="display:flex;gap:8px;margin-bottom:14px;">`;
    html+=`<button class="btn-p" style="flex:1;padding:10px;border-radius:8px;font-size:17px;color:#ffffff;" onclick="openAddChapter('${cId}')">+ سرفصل جدید</button>`;
    if(chs.length>1||D.topics.some(t=>chs.some(ch=>ch.id===t.chapterId))){
      const dragBtnStyle=isDragMode
        ?'border:1px solid var(--green);background:#4ade8018;color:var(--green);'
        :'border:1px solid var(--border);background:var(--bg3);color:var(--text3);';
      html+=`<button onclick="toggleChapterDragMode('${cId}')" style="padding:10px 14px;border-radius:8px;font-size:15px;font-weight:600;${dragBtnStyle}">${isDragMode?'✓ پایان':'⇅ ترتیب'}</button>`;
    }
    html+=`</div>`;
  }

  if(!chs.length){
    html+=`<div style="text-align:center;padding:40px;color:var(--text3);">سرفصلی اضافه نشده</div>`;
    return html;
  }

  // ── Drag mode: reorder chapters + topics inside each ──
  if(isDragMode){
    html+=`<div id="ch-drag-list-${cId}">`;
    chs.forEach(ch=>{
      const tops=D.topics.filter(t=>t.chapterId===ch.id);
      const r2=cReady(ch.id);
      html+=`<div class="card ch-drag-item" data-chid="${ch.id}" data-cid="${cId}" draggable="true"
        style="margin-bottom:10px;cursor:grab;touch-action:none;user-select:none;"
        ondragstart="onChDragStart(event,'${ch.id}')"
        ondragover="onChDragOver(event,'${ch.id}','${cId}')"
        ondragend="onChDragEnd(event,'${cId}')"
        ontouchstart="onChTouchStart(event,'${ch.id}','${cId}')"
        ontouchmove="onChTouchMove(event)"
        ontouchend="onChTouchEnd(event,'${cId}')">`;
      const isDOpen=!!openChapters['d_'+ch.id];
      html+=`<div style="display:flex;align-items:center;gap:12px;">`;
      html+=`<span style="color:var(--text3);font-size:20px;flex-shrink:0;cursor:grab;">☰</span>`;
      html+=`<div style="flex:1;min-width:0;"><div style="font-size:16px;font-weight:600;">${ch.name}</div><div style="font-size:13px;color:var(--text3);margin-top:2px;">${tops.length} موضوع</div></div>`;
      html+=`${r2!==null?'<span style="font-size:15px;font-weight:700;color:'+rc(r2)+';">'+r2+'%</span>':''}`;
      if(tops.length)html+=`<span onclick="event.stopPropagation();toggleDragChapter('${ch.id}')" style="color:var(--text3);font-size:12px;cursor:pointer;transition:transform 0.2s;display:inline-block;${isDOpen?'transform:rotate(90deg)':''}">▶</span>`;
      html+=`</div>`;
      if(tops.length&&isDOpen){
        html+=`<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:8px;">`;
        tops.forEach(t=>{
          const tr=tReady(t);
          html+=`<div class="top-drag-item" data-tid="${t.id}" data-chid="${ch.id}" draggable="true"
            style="display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:grab;touch-action:none;user-select:none;"
            ondragstart="onTopDragStart(event,'${t.id}')"
            ondragover="onTopDragOver(event,'${t.id}','${ch.id}')"
            ondragend="onTopDragEnd(event,'${ch.id}')"
            ontouchstart="onTopTouchStart(event,'${t.id}','${ch.id}')"
            ontouchmove="onTopTouchMove(event)"
            ontouchend="onTopTouchEnd(event,'${ch.id}')">`;
          html+=`<span style="color:var(--text3);font-size:16px;flex-shrink:0;">⋮⋮</span>`;
          html+=`<div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:500;">${t.name}</div>`;
          const subs=getSubtopics(t.id);
          if(subs.length){
            html+=`<div style="font-size:12px;color:var(--text3);margin-top:2px;">${subs.length} زیرموضوع</div>`;
            html+=`</div><span style="font-size:14px;font-weight:700;color:${rc(tr)};">${tr!==null?tr+'%':'—'}</span></div>`;
            // subtopics drag inside
            html+=`<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);">`;
            subs.forEach(s=>{
              html+=`<div class="sub-drag-item" data-sid="${s.id}" data-tid="${t.id}" draggable="true"
                style="display:flex;align-items:center;gap:8px;background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:5px;cursor:grab;touch-action:none;user-select:none;"
                ondragstart="onSubDragStart(event,'${s.id}')"
                ondragover="onSubDragOver(event,'${s.id}','${t.id}')"
                ondragend="onSubDragEnd(event,'${t.id}')"
                ontouchstart="onSubTouchStart(event,'${s.id}','${t.id}')"
                ontouchmove="onSubTouchMove(event)"
                ontouchend="onSubTouchEnd(event,'${t.id}')">`;
              html+=`<span style="color:var(--text3);font-size:14px;flex-shrink:0;">⋮⋮</span>`;
              html+=`<span style="font-size:14px;flex:1;">${s.name}</span>`;
              html+=`</div>`;
            });
            html+=`</div>`;
          } else {
            html+=`</div><span style="font-size:14px;font-weight:700;color:${rc(tr)};">${tr!==null?tr+'%':'—'}</span>`;
          }
          html+=`</div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
    return html;
  }

  // ── Normal mode ──
  chs.forEach(ch=>{
    const tops=D.topics.filter(t=>t.chapterId===ch.id);
    const r2=cReady(ch.id);
    const isOpen=!!openChapters['p_'+ch.id];
    const isEditing=editingChapterId===ch.id;

    html+=`<div class="card" style="margin-bottom:10px;">`;
    html+=`<div style="display:flex;align-items:center;gap:10px;">`;

    if(isEditing){
      html+=`<div style="flex:1;"><div style="display:flex;align-items:center;gap:8px;">`;
      html+=`<input id="inline-ch-${ch.id}" class="mi" value="${ch.name.replace(/"/g,'&quot;')}" style="flex:1;padding:7px 10px;font-size:16px;" onkeydown="if(event.key==='Enter')saveChapterInline('${ch.id}');if(event.key==='Escape')cancelChapterEdit();"/>`;

// ── REVIEW ────────────────────────────────────────────────────────────────────
function renderReview(){
  const items=reviewableItems();
  if(!items.length)return`<div style="text-align:center;padding:60px 20px;">
    <div style="font-size:50px;margin-bottom:12px;">✓</div>
    <div style="font-size:17px;font-weight:600;color:var(--green);">برای امروز تمومه!</div>
    <div style="font-size:17px;color:var(--text3);margin-top:6px;">${D.topics.length} موضوع در سیستم</div>
  </div>`;

  const groups={};
  items.forEach(item=>{
    const t=item.t;
    const c=getCrs(t);
    const key=c?c.id:'other';
    if(!groups[key])groups[key]={c,items:[]};
    groups[key].items.push(item);
  });

  let html='';
  Object.values(groups).forEach(({c,items:gitems})=>{
    html+=`<div style="font-size:17px;font-weight:600;color:var(--text3);margin-bottom:8px;margin-top:16px;letter-spacing:0.4px;">
      ${c?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-left:6px;"></span>${c.name}`:'سایر'}
    </div>`;
    gitems.forEach(item=>{
      if(item.type==='topic'){
        const t=item.t;
        const ch=getCh(t),diff=daysDiff(t.nextReview);
        const last5=t.history.slice(-5).map(h=>gb(h.grade)).join('');
        const tr=tReady(t);
        html+=`<div class="card" style="margin-bottom:10px;" id="t-${t.id}">
          <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;color:var(--text3);margin-bottom:3px;">${ch?ch.name:''}</div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:16px;font-weight:500;color:var(--text);">${t.name}</span>
                ${t.lastGrade?gb(t.lastGrade):''}
              </div>
              <div style="display:flex;gap:6px;margin-top:5px;align-items:center;flex-wrap:wrap;">
                ${t.importance?ib(t.importance):''}
                <span style="font-size:17px;color:${diff<=0?'#fb923c':'var(--text3)'};"> مرور بعدی: ${diff===0?'امروز':diff<0?Math.abs(diff)+' روز تأخیر':diff+' روز دیگر'}</span>
              </div>
              ${trendChart(t.history)}
            </div>
          </div>
          ${gradingId===t.id?gradeRow(t.id):`<button onclick="gradingId='${t.id}';render()" style="margin-top:8px;width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:17px;">ثبت نمره</button>`}
          <div style="margin-top:8px;">
            <button onclick="toggleNote('note-${t.id}')" style="font-size:13px;color:var(--text3);background:none;border:none;padding:2px 0;display:flex;align-items:center;gap:4px;">
              <span id="note-icon-${t.id}">${t.note?'📝':'📝'}</span>
              <span id="note-label-${t.id}" style="text-decoration:underline;">${t.note?'نمایش یادداشت':'یادداشت'}</span>
            </button>
            <div id="note-${t.id}" style="display:none;">
              <textarea class="note-ta" style="margin-top:6px;" placeholder="یادداشت..." onchange="saveNote('${t.id}',this.value)">${t.note??''}</textarea>
            </div>
          </div>
        </div>`;
      } else {
        // subtopic
        const t=item.t,s=item.s;
        const ch=getCh(t),diff=daysDiff(s.nextReview);
        const slast5=s.history.slice(-5).map(h=>gb(h.grade)).join('');
        const sr=stReady(s);
        html+=`<div class="card" style="margin-bottom:10px;" id="s-${s.id}">
          <div style="font-size:13px;color:var(--text3);margin-bottom:6px;">${ch?ch.name+' / ':''} ${t.name}</div>
          <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
            ${gb(s.lastGrade)}
            <div style="flex:1;min-width:0;">
              <div style="font-size:16px;font-weight:500;color:var(--text);">${s.name}</div>
              <div style="display:flex;gap:6px;margin-top:5px;align-items:center;flex-wrap:wrap;">
              </div>
              ${trendChart(s.history)}
            </div>
            ${diff<0?`<span style="font-size:13px;color:#f87171;flex-shrink:0;">${Math.abs(diff)}روز تأخیر</span>`:''}
          </div>
          ${gradingId===s.id?subGradeRow(s.id):`<button onclick="gradingId='${s.id}';render()" style="margin-top:8px;width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:17px;">ثبت نمره</button>`}
          <div style="margin-top:8px;">
            <button onclick="toggleNote('snote-${s.id}')" style="font-size:13px;color:var(--text3);background:none;border:none;padding:2px 0;display:flex;align-items:center;gap:4px;">
              <span style="text-decoration:underline;">${s.note?'نمایش یادداشت':'یادداشت'}</span>
            </button>
            <div id="snote-${s.id}" style="display:none;">
              <textarea class="note-ta" style="margin-top:6px;" placeholder="یادداشت..." onchange="saveSubNote('${s.id}',this.value)">${s.note??''}</textarea>
            </div>
          </div>
        </div>`;
      }
    });
  });
  return html;
}

function gradeRow(id){
  return`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
    ${Object.entries(GC).map(([g,c])=>`<button class="grade-btn" onclick="applyGrade('${id}','${g}')" style="background:${c.color}18;border:1.5px solid ${c.color};color:${c.color};">${c.l}</button>`).join('')}
    <button onclick="gradingId=null;render()" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--text3);">لغو</button>
  </div>`;
}

function toggleTopicOpen(id){openTopics[id]=!openTopics[id];render();}
function reviewableItems(){
  const items=[];
  D.topics.forEach(t=>{
    const subs=getSubtopics(t.id);
    if(subs.length){subs.forEach(s=>{if(s.nextReview<=today())items.push({type:'sub',t,s});});}
    else{if(t.nextReview<=today())items.push({type:'topic',t});}
  });
  return items;
}

function toggleNote(elId){const el=document.getElementById(elId);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function saveNote(id,val){D.topics=D.topics.map(t=>t.id===id?{...t,note:val}:t);sd();}
function saveSubNote(id,val){D.subtopics=D.subtopics.map(s=>s.id===id?{...s,note:val}:s);sd();}

function applyGrade(id,grade){
  const cfg=GC[grade];
  D.topics=D.topics.map(t=>t.id!==id?t:{...t,lastGrade:grade,nextReview:addDays(today(),cfg.days),history:[...t.history,{date:today(),grade}]});
  gradingId=null;sd();render();flash('نمره ثبت شد','#4ade80');
}

// ── EXPORT/IMPORT ─────────────────────────────────────────────────────────────
function exportData(fmt){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`study-${today()}.${fmt}`;a.click();
  URL.revokeObjectURL(url);flash('فایل ذخیره شد');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.courses&&p.topics){D=p;sd();render();flash('داده‌ها بارگذاری شدن');}else flash('فایل معتبر نیست','#f87171');}catch{flash('خطا','#f87171');}};
  r.readAsText(f);e.target.value='';
}

function reorderChapter(cId,fromId,toId){
  if(fromId===toId)return;
  const chs=D.chapters.filter(c=>c.courseId===cId);
  const others=D.chapters.filter(c=>c.courseId!==cId);
  const fi=chs.findIndex(c=>c.id===fromId);
  const ti=chs.findIndex(c=>c.id===toId);
  if(fi<0||ti<0)return;
  const moved=chs.splice(fi,1)[0];
  chs.splice(ti,0,moved);
  D.chapters=[...others,...chs];
  sd();render();
}
function reorderTopic(chId,fromId,toId){
  if(fromId===toId)return;
  const tops=D.topics.filter(t=>t.chapterId===chId);
  const others=D.topics.filter(t=>t.chapterId!==chId);
  const fi=tops.findIndex(t=>t.id===fromId);
  const ti=tops.findIndex(t=>t.id===toId);
  if(fi<0||ti<0)return;
  const moved=tops.splice(fi,1)[0];
  tops.splice(ti,0,moved);
  D.topics=[...others,...tops];
  sd();render();
}
function reorderSubtopic(topId,fromId,toId){
  if(fromId===toId)return;
  const subs=(D.subtopics||[]).filter(s=>s.topicId===topId);
  const others=(D.subtopics||[]).filter(s=>s.topicId!==topId);
  const fi=subs.findIndex(s=>s.id===fromId);
  const ti=subs.findIndex(s=>s.id===toId);
  if(fi<0||ti<0)return;
  const moved=subs.splice(fi,1)[0];
  subs.splice(ti,0,moved);

}

function closeSearch(){document.getElementById('search-bg').classList.remove('open');}
function tokenize(str){return str.toLowerCase().trim().split(/\s+/).filter(Boolean);}
function fuzzyMatch(name,q){
  if(!q)return true;
  const tokens=tokenize(q);
  const n=name.toLowerCase();
  return tokens.every(tok=>n.includes(tok));
}
function doSearch(){
  const q=(document.getElementById('sq')?.value??'').trim();
  const cId=document.getElementById('sf-course')?.value??'';
  const grade=document.getElementById('sf-grade')?.value??'';
  const imp=document.getElementById('sf-imp')?.value??'';
  const el=document.getElementById('s-results');if(!el)return;
  if(!q&&!cId&&!grade&&!imp){el.innerHTML=`<div style="text-align:center;padding:24px;color:var(--text3);font-size:17px;">برای جستجو تایپ کن...</div>`;return;}
  let res=D.topics.filter(t=>{
    if(q&&!fuzzyMatch(t.name,q))return false;
    if(grade&&t.lastGrade!==grade)return false;
    if(imp&&t.importance!==imp)return false;
    if(cId){const c=getCrs(t);if(!c||c.id!==cId)return false;}
    return true;
  });
  if(!res.length){el.innerHTML=`<div style="text-align:center;padding:24px;color:var(--text3);font-size:17px;">نتیجه‌ای یافت نشد</div>`;return;}
  el.innerHTML=res.slice(0,15).map(t=>{
    const c=getCrs(t),ch=getCh(t);
    const diff=daysDiff(t.nextReview);
    return`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="closeSearch();scrollToTopic('${t.id}')">
      ${gb(t.lastGrade)}
      <div style="flex:1;min-width:0;">
        <div style="font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.name}</div>
        <div style="font-size:13px;color:var(--text3);margin-top:2px;">${c?c.name:''} ${ch?'/ '+ch.name:''}</div>
      </div>
      ${t.importance?ib(t.importance):''}
      <span style="font-size:13px;color:${diff<=0?'#fb923c':'var(--text3)'};flex-shrink:0;">${diff===0?'امروز':diff<0?Math.abs(diff)+'روز تأخیر':diff+'روز دیگر'}</span>
    </div>`;
  }).join('');
}

// ── TREND CHART ───────────────────────────────────────────────────────────────
function trendChart(history){
  if(history.length<2)return'';
  const last8=history.slice(-8);
  const w=180,h=40,pad=4;
  const scores=last8.map(h=>gs(h.grade));
  const min=0,max=100;
  const pts=scores.map((s,i)=>{
    const x=pad+i*(w-pad*2)/(last8.length-1);
    const y=h-pad-(s-min)/(max-min)*(h-pad*2);
    return`${x},${y}`;
  }).join(' ');
  const lt=document.body.classList.contains('light');
  function cc(s){return s>=80?(lt?'#15803d':'#4ade80'):s>=60?(lt?'#4d7c0f':'#a3e635'):s>=40?(lt?'#a16207':'#facc15'):s>=20?(lt?'#c2410c':'#fb923c'):(lt?'#b91c1c':'#f87171');}
  const color=cc(scores[scores.length-1]);
  return`<svg width="${w}" height="${h}" style="display:block;margin-top:6px;">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
    ${scores.map((s,i)=>{
      const x=pad+i*(w-pad*2)/(last8.length-1);
      const y=h-pad-(s-min)/(max-min)*(h-pad*2);
      return`<circle cx="${x}" cy="${y}" r="2.5" fill="${cc(s)}"/>`;
    }).join('')}
  </svg>`;
}


// ── CHAPTER DRAG & DROP ───────────────────────────────────────────────────────
let dragOverChId=null;
let touchDragChId=null;
let touchDragCId=null;
let touchClone=null;
let touchStartY=0;

function onChDragStart(e,chId){
  dragSrcChId=chId;
  e.dataTransfer.effectAllowed='move';
  e.target.style.opacity='0.4';
}
function onChDragOver(e,chId,cId){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  if(dragOverChId===chId)return;
  dragOverChId=chId;
  document.querySelectorAll('.ch-drag-item').forEach(el=>{
    el.style.borderColor=el.dataset.chid===chId?'var(--blue)':'var(--border)';
  });
}
function onChDragEnd(e,cId){
  e.target.style.opacity='1';
  if(dragOverChId&&dragSrcChId&&dragOverChId!==dragSrcChId){
    reorderChapter(cId,dragSrcChId,dragOverChId);
  }
  dragSrcChId=null;dragOverChId=null;
  document.querySelectorAll('.ch-drag-item').forEach(el=>el.style.borderColor='var(--border)');
}

// Touch support
function onChTouchStart(e,chId,cId){
  touchDragChId=chId;
  touchDragCId=cId;
  touchStartY=e.touches[0].clientY;
  const el=e.currentTarget;
  touchClone=el.cloneNode(true);
  touchClone.style.cssText=`position:fixed;left:${el.getBoundingClientRect().left}px;top:${el.getBoundingClientRect().top}px;width:${el.offsetWidth}px;opacity:0.85;z-index:9999;pointer-events:none;background:var(--bg3);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);`;
  document.body.appendChild(touchClone);
  el.style.opacity='0.3';
}
function onChTouchMove(e){
  if(!touchClone)return;
  e.preventDefault();
  const dy=e.touches[0].clientY-touchStartY;
  const rect=touchClone.getBoundingClientRect();
  touchClone.style.top=(rect.top+dy)+'px';
  touchStartY=e.touches[0].clientY;
  // find what we're hovering over
  touchClone.style.display='none';
  const el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
  touchClone.style.display='';
  const item=el?.closest('.ch-drag-item');
  document.querySelectorAll('.ch-drag-item').forEach(x=>x.style.borderColor='var(--border)');
  if(item&&item.dataset.chid!==touchDragChId){
    item.style.borderColor='var(--blue)';
    dragOverChId=item.dataset.chid;
  }
}
function onChTouchEnd(e,cId){
  if(touchClone){touchClone.remove();touchClone=null;}
  document.querySelectorAll('.ch-drag-item').forEach(el=>{
    el.style.opacity='1';el.style.borderColor='var(--border)';
  });
  if(dragOverChId&&touchDragChId&&dragOverChId!==touchDragChId){
    reorderChapter(cId,touchDragChId,dragOverChId);
  }
  touchDragChId=null;touchDragCId=null;dragOverChId=null;
}

let touchDragTopParent=null;
let touchDragSubId=null;
let touchDragSubParent=null;

function onTopTouchStart(e,tId,chId){
  touchDragTopId=tId;touchDragTopParent=chId;topTouchStartY=e.touches[0].clientY;
  const el=e.currentTarget;
  topTouchClone=el.cloneNode(true);
  const rect=el.getBoundingClientRect();
  topTouchClone.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+el.offsetWidth+'px;opacity:0.85;z-index:9999;pointer-events:none;background:var(--bg3);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.4);';
  document.body.appendChild(topTouchClone);
  el.style.opacity='0.3';
}
function onTopTouchMove(e){
  if(!topTouchClone)return;
  e.preventDefault();
  const dy=e.touches[0].clientY-topTouchStartY;
  const rect=topTouchClone.getBoundingClientRect();
  topTouchClone.style.top=(rect.top+dy)+'px';
  topTouchStartY=e.touches[0].clientY;
  topTouchClone.style.display='none';
  const el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
  topTouchClone.style.display='';
  const item=el?.closest('.top-drag-item');
  document.querySelectorAll('.top-drag-item').forEach(x=>x.style.borderColor='var(--border)');
  if(item&&item.dataset.tid!==touchDragTopId){item.style.borderColor='var(--blue)';dragOverTopId=item.dataset.tid;}
  else dragOverTopId=null;
}
function onTopTouchEnd(e,chId){
  if(topTouchClone){topTouchClone.remove();topTouchClone=null;}
  document.querySelectorAll('.top-drag-item').forEach(el=>{el.style.opacity='1';el.style.borderColor='var(--border)';});
  if(dragOverTopId&&touchDragTopId&&dragOverTopId!==touchDragTopId)reorderTopic(chId,touchDragTopId,dragOverTopId);
  touchDragTopId=null;dragOverTopId=null;
}

// Subtopic drag
let dragSrcSubId=null;let dragOverSubId=null;let subTouchClone=null;let subTouchStartY=0;
function onSubDragStart(e,sId){dragSrcSubId=sId;e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='0.4';}
function onSubDragOver(e,sId,tId){
  e.preventDefault();
  if(dragOverSubId===sId)return;
  dragOverSubId=sId;
  document.querySelectorAll('.sub-drag-item[data-tid="'+tId+'"]').forEach(el=>{
    el.style.borderColor=el.dataset.sid===sId?'var(--blue)':'var(--border)';
  });
}
function onSubDragEnd(e,tId){
  e.currentTarget.style.opacity='1';
  if(dragOverSubId&&dragSrcSubId&&dragOverSubId!==dragSrcSubId)reorderSubtopic(tId,dragSrcSubId,dragOverSubId);
  dragSrcSubId=null;dragOverSubId=null;
  document.querySelectorAll('.sub-drag-item').forEach(el=>el.style.borderColor='var(--border)');
}
function onSubTouchStart(e,sId,tId){
  dragSrcSubId=sId;subTouchStartY=e.touches[0].clientY;
  const el=e.currentTarget;
  subTouchClone=el.cloneNode(true);
  const rect=el.getBoundingClientRect();
  subTouchClone.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+el.offsetWidth+'px;opacity:0.85;z-index:9999;pointer-events:none;background:var(--bg4);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.4);';
  document.body.appendChild(subTouchClone);
  el.style.opacity='0.3';
}
function onSubTouchMove(e){
  if(!subTouchClone)return;
  e.preventDefault();
  const dy=e.touches[0].clientY-subTouchStartY;
  const rect=subTouchClone.getBoundingClientRect();
  subTouchClone.style.top=(rect.top+dy)+'px';
  subTouchStartY=e.touches[0].clientY;
  subTouchClone.style.display='none';
  const el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
  subTouchClone.style.display='';
  const item=el?.closest('.sub-drag-item');
  document.querySelectorAll('.sub-drag-item').forEach(x=>x.style.borderColor='var(--border)');
  if(item&&item.dataset.sid!==dragSrcSubId){item.style.borderColor='var(--blue)';dragOverSubId=item.dataset.sid;}
  else dragOverSubId=null;
}
function onSubTouchEnd(e,tId){
  if(subTouchClone){subTouchClone.remove();subTouchClone=null;}
  document.querySelectorAll('.sub-drag-item').forEach(el=>{el.style.opacity='1';el.style.borderColor='var(--border)';});
  if(dragOverSubId&&dragSrcSubId&&dragOverSubId!==dragSrcSubId)reorderSubtopic(tId,dragSrcSubId,dragOverSubId);
  dragSrcSubId=null;dragOverSubId=null;
}
// ── INIT ──────────────────────────────────────────────────────────────────────
if(!D.chapters)D.chapters=[];

function showLoginScreen(){
  document.getElementById('app').classList.add('app-hidden');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').style.display='none';
  setTimeout(()=>document.getElementById('login-user').focus(),100);
}

// ── AUTO LOGOUT (15 min inactivity) ──────────────────────────────────────────
let inactivityTimer=null;
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  if(!currentUser)return;
  inactivityTimer=setTimeout(()=>{
    doLogout();
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-err').textContent='به دلیل عدم فعالیت، بصورت خودکار خارج شدید';
  }, 15*60*1000);
}
['click','keydown','touchstart','scroll'].forEach(ev=>
  document.addEventListener(ev, resetInactivityTimer, {passive:true})
);

function hideLoginScreen(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.remove('app-hidden');
}

function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');
  const found=USERS.find(x=>x.username===u&&x.password===p);
  if(!found){err.style.display='block';document.getElementById('login-pass').value='';return;}
  err.style.display='none';
  currentUser=u;
  SK=userSK(u);
  PK=userPK(u);
  D=ld();P=lp();
  setSession(u);
  hideLoginScreen();
  applyTheme();
  applySidebar();
  goto('dashboard');
  setTimeout(showBanner,500);
  resetInactivityTimer();
}

function doLogout(){
  clearSession();
  currentUser=null;
  D={courses:[],chapters:[],topics:[],subtopics:[]};
  P={theme:'dark'};
  showLoginScreen();
}

// بررسی session موجود
const sess=getSession();
if(sess&&USERS.find(x=>x.username===sess.username)){
  currentUser=sess.username;
  SK=userSK(currentUser);
  PK=userPK(currentUser);
  D=ld();P=lp();
  hideLoginScreen();
  applyTheme();
  applySidebar();
  goto('dashboard');
  setTimeout(showBanner,500);
  resetInactivityTimer();
}else{
  showLoginScreen();
}
</script>
