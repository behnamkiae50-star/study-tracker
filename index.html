<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#111114"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111114'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='62'%3E🎓%3C/text%3E%3C/svg%3E"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111114'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='62'%3E🎓%3C/text%3E%3C/svg%3E"/>
<title>Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet"/>
<style>
@font-face{font-family:'Titr';src:url('https://cdn.jsdelivr.net/gh/rastikerdar/titr-font@v1.1/Titr.woff2') format('woff2');font-weight:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#111114;--bg2:#18181c;--bg3:#1e1e24;--bg4:#26262e;
  --border:#2e2e38;--border2:#3a3a46;
  --text:#f5f3ee;--text2:#c8c6d0;--text3:#7a7888;
  --accent:#3a3a44;--accent2:#4e4e5c;
  --green:#4ade80;--yellow:#facc15;--orange:#fb923c;--red:#f87171;--blue:#60a5fa;
  --charcoal:#3d3d4a;--charcoal2:#4a4a58;
  --base-size:16px;
}
body.light{
  --bg:#f2f0ec;--bg2:#e8e6e0;--bg3:#dedad2;--bg4:#d0cdc4;
  --border:#c4c0b8;--border2:#b0ada4;
  --text:#0e0d14;--text2:#2e2c3a;--text3:#6a6878;
  --accent:#dedad2;--accent2:#c8c5bc;
  --charcoal:#4a4a58;--charcoal2:#5a5a6a;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Vazirmatn',sans-serif;direction:rtl;overflow:hidden;font-size:var(--base-size);}
button{cursor:pointer;border:none;outline:none;font-family:inherit;background:none;}
input,select,textarea{font-family:inherit;direction:rtl;outline:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:240px;min-width:240px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:width 0.25s,min-width 0.25s;overflow:hidden;flex-shrink:0;}
#sidebar.closed{width:0;min-width:0;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg);}
#content{flex:1;overflow-y:auto;padding:18px;}

/* SIDEBAR */
#sidebar-inner{display:flex;flex-direction:column;height:100%;min-width:240px;}
.sidebar-section{padding:10px 12px 4px;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;}
.sidebar-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.15s;border:none;background:none;width:100%;text-align:right;margin:1px 0;}
.sidebar-item:hover{background:var(--bg3);color:var(--text);}
.sidebar-item.active{background:var(--bg4);color:var(--text);}
.sidebar-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sidebar-courses{flex:1;overflow-y:auto;padding:6px 8px;}
.sidebar-bottom{padding:8px;border-top:1px solid var(--border);}

/* CHAPTER ACCORDION */
.ch-header{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text2);transition:all 0.15s;font-family:'Titr','Vazirmatn',sans-serif;}
.ch-header:hover{background:var(--bg3);color:var(--text);}
.ch-header.active{color:var(--text);}
.titr{font-family:'Titr','Vazirmatn',sans-serif;}
.ch-arrow{font-size:10px;transition:transform 0.2s;margin-right:auto;}
.ch-arrow.open{transform:rotate(90deg);}
.ch-topics{padding-right:20px;overflow:hidden;max-height:0;transition:max-height 0.25s ease;}
.ch-topics.open{max-height:999px;}
.ch-topic-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;font-size:12px;color:var(--text3);cursor:pointer;transition:all 0.15s;}
.ch-topic-item:hover{background:var(--bg3);color:var(--text2);}

/* HEADER */
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;transition:all 0.15s;border:1px solid var(--border);background:var(--bg2);}
.icon-btn:hover{color:var(--text);border-color:var(--border2);}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color 0.15s;}
.card:hover{border-color:var(--border2);}

/* GRADE BADGE */
.gb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:17px;border-radius:5px;font-size:10px;font-weight:700;flex-shrink:0;}
.gA{background:#4ade8022;border:1.5px solid #4ade80;color:#4ade80;}
.gBplus{background:#a3e63522;border:1.5px solid #a3e635;color:#a3e635;}
.gB{background:#facc1522;border:1.5px solid #facc15;color:#facc15;}
.gC{background:#fb923c22;border:1.5px solid #fb923c;color:#fb923c;}
.gD{background:#f8717122;border:1.5px solid #f87171;color:#f87171;}
.gNone{background:var(--bg4);border:1.5px solid var(--border2);color:var(--text3);}

/* IMPORTANCE */
.imp{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.imp-low{background:var(--bg4);color:var(--text3);border:1px solid var(--border2);}
.imp-med{background:#60a5fa18;color:#60a5fa;border:1px solid #60a5fa44;}
.imp-high{background:#fb923c18;color:#fb923c;border:1px solid #fb923c44;}
.imp-critical{background:#f8717118;color:#f87171;border:1px solid #f8717144;}

/* PROGRESS */
.pbar{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.pfill{height:100%;border-radius:2px;transition:width 0.3s;}

/* STAT */
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.stat-n{font-size:26px;font-weight:800;line-height:1;color:var(--text);}
.stat-l{font-size:11px;color:var(--text3);margin-top:4px;}

/* GRADE BUTTONS */
.grade-btn{padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;transition:transform 0.1s;}
.grade-btn:active{transform:scale(0.95);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:50;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg2);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text);}
.mi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;}
.mi::placeholder{color:var(--text3);}
.btn-p{width:100%;background:var(--charcoal2);color:var(--text);padding:12px;border-radius:8px;font-size:14px;font-weight:600;}
.btn-s{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:11px;border-radius:8px;font-size:14px;}
.btn-d{width:100%;background:#f8717118;border:1px solid #f87171;color:#f87171;padding:10px;border-radius:8px;font-size:13px;}

/* NOTE */
.note-ta{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:13px;resize:none;min-height:65px;line-height:1.5;}
.note-ta::placeholder{color:var(--text3);}

/* FLASH */
.flash{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#0a0a0f;padding:9px 22px;border-radius:24px;font-weight:700;font-size:13px;animation:fu 2s ease forwards;z-index:999;}
@keyframes fu{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* COLOR DOTS */
.cdot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform 0.1s;}
.cdot.sel{border-color:var(--text);transform:scale(1.2);}

/* OVERLAY for mobile */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;}
@media(max-width:640px){
  #sidebar{position:fixed;right:0;top:0;height:100%;z-index:45;transform:translateX(0);transition:transform 0.25s;}
  #sidebar.closed{transform:translateX(100%);width:240px;min-width:240px;}
  #overlay.visible{display:block;}
}
@media(min-width:641px){
  #content{max-width:720px;margin:0 auto;width:100%;}
}
</style>
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-inner">
      <div style="padding:16px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:14px;font-weight:700;color:var(--text);">مرور هوشمند</span>
        <button class="icon-btn" onclick="closeSidebar()" style="width:28px;height:28px;font-size:14px;border:none;background:none;">✕</button>
      </div>

      <div style="padding:8px;">
        <button class="sidebar-item active" id="si-dashboard" onclick="goto('dashboard')">📊 داشبورد</button>
        <button class="sidebar-item" id="si-review" onclick="goto('review')">🔄 مرور امروز</button>
      </div>

      <div class="sidebar-section">دروس</div>
      <div class="sidebar-courses" id="sidebar-courses"></div>

      <div class="sidebar-bottom">
        <button class="sidebar-item" id="si-settings" onclick="goto('settings')" style="width:100%;">⚙️ تنظیمات</button>
      </div>
    </div>
  </div>

  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div id="main">
    <div id="header">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:700;color:var(--text);" id="h-title">داشبورد</div>
        <div style="font-size:11px;color:var(--text3);" id="h-sub"></div>
      </div>
      <button class="icon-btn" onclick="openSearch()" style="font-size:15px;">🔍</button>
      <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">☀</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- SEARCH MODAL -->
<div class="modal-bg" id="search-bg" onclick="if(event.target===this)closeSearch()">
  <div class="modal" id="search-inner"></div>
</div>

<!-- DUE BANNER -->
<div id="due-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:30;background:#fb923c;color:#0a0a0f;padding:10px 16px;font-size:13px;font-weight:600;display:none;align-items:center;gap:10px;">
  <span id="due-banner-text"></span>
  <button onclick="goto('review');hideBanner()" style="margin-right:auto;background:rgba(0,0,0,0.2);color:#0a0a0f;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;">مرور الان</button>
  <button onclick="hideBanner()" style="font-size:18px;color:#0a0a0f;opacity:0.7;">✕</button>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const SK='study-v3',PK='study-v3-prefs';
const GC={A:{l:'A',color:'#4ade80',days:10,desc:'می‌توانم آموزش دهم'},Bplus:{l:'B+',color:'#a3e635',days:7,desc:'مسلط، چند نکته جزئی'},B:{l:'B',color:'#facc15',days:4,desc:'مفهوم را می‌دانم'},C:{l:'C',color:'#fb923c',days:2,desc:'آشنا، جزئیات کم'},D:{l:'D',color:'#f87171',days:1,desc:'فراموش کرده‌ام'}};
const IC={low:{l:'کم‌اهمیت',cls:'imp-low'},med:{l:'متوسط',cls:'imp-med'},high:{l:'مهم',cls:'imp-high'},critical:{l:'بسیار مهم',cls:'imp-critical'}};
const COLORS=['#6b7280','#3d9970','#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'];

function ld(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{courses:[],chapters:[],topics:[]};}catch{return{courses:[],chapters:[],topics:[]};}}
function sd(){localStorage.setItem(SK,JSON.stringify(D));}
function lp(){try{const r=localStorage.getItem(PK);return r?JSON.parse(r):{theme:'dark'};}catch{return{theme:'dark'};}}
function sp(){localStorage.setItem(PK,JSON.stringify({theme:P.theme}));}

let D=ld(),P=lp(),page='dashboard',gradingId=null,openChapters={},selColor=COLORS[0];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().split('T')[0];}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().split('T')[0];}
function daysDiff(d){return Math.round((new Date(d)-new Date(today()))/(864e5));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function gs(g){return{A:100,Bplus:85,B:65,C:40,D:10}[g]??0;}
function tReady(t){if(!t.history.length)return null;const l=t.history.slice(-5);return Math.round(l.reduce((s,h)=>s+gs(h.grade),0)/l.length);}
function cReady(chId){const ts=D.topics.filter(t=>t.chapterId===chId&&t.history.length);if(!ts.length)return null;return Math.round(ts.map(t=>tReady(t)).reduce((a,b)=>a+b,0)/ts.length);}
function crsReady(cId){const chs=D.chapters.filter(c=>c.courseId===cId);const sc=chs.map(c=>cReady(c.id)).filter(x=>x!==null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;}
function rc(r){if(r===null)return'var(--text3)';if(r>=80)return'#4ade80';if(r>=60)return'#a3e635';if(r>=40)return'#facc15';if(r>=20)return'#fb923c';return'#f87171';}
function getCh(t){return D.chapters.find(c=>c.id===t.chapterId);}
function getCrs(t){const ch=getCh(t);return ch?D.courses.find(c=>c.id===ch.courseId):null;}
function gb(g){if(!g)return`<span class="gb gNone">—</span>`;const k=g.replace('+','plus');return`<span class="gb g${k}">${GC[g]?.l??g}</span>`;}
function ib(i){if(!i)return'';return`<span class="imp ${IC[i].cls}">${IC[i].l}</span>`;}
function flash(msg,color){document.querySelectorAll('.flash').forEach(e=>e.remove());const el=document.createElement('div');el.className='flash';el.textContent=msg;if(color)el.style.background=color;document.body.appendChild(el);setTimeout(()=>el.remove(),2300);}
function relDate(d){if(!d||d==='—')return'—';const diff=daysDiff(d);if(diff===0)return'امروز';if(diff<0)return Math.abs(diff)+' روز پیش';return diff+' روز دیگر';}

// ── THEME ─────────────────────────────────────────────────────────────────────
function applyTheme(){document.body.classList.toggle('light',P.theme==='light');const b=document.getElementById('theme-btn');if(b)b.textContent=P.theme==='dark'?'☀':'🌙';}
function toggleTheme(){P.theme=P.theme==='dark'?'light':'dark';applyTheme();sp();}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
let sidebarOpen=window.innerWidth>640;
function isMobile(){return window.innerWidth<=640;}
function toggleSidebar(){sidebarOpen=!sidebarOpen;applySidebar();}
function closeSidebar(){sidebarOpen=false;applySidebar();}
function applySidebar(){
  document.getElementById('sidebar').classList.toggle('closed',!sidebarOpen);
  if(isMobile())document.getElementById('overlay').classList.toggle('visible',sidebarOpen);
}

function renderSidebar(){
  const el=document.getElementById('sidebar-courses');
  let html='';
  D.courses.forEach(c=>{
    const chs=D.chapters.filter(ch=>ch.courseId===c.id);
    const due=D.topics.filter(t=>chs.some(ch=>ch.id===t.chapterId)&&t.nextReview<=today()).length;
    html+=`<button class="sidebar-item" onclick="goto('course:${c.id}')" id="si-course-${c.id}">
      <span class="dot" style="background:${c.color};"></span>
      <span style="flex:1;">${c.name}</span>
      ${due>0?`<span style="font-size:10px;background:${c.color}22;color:${c.color};padding:1px 6px;border-radius:10px;">${due}</span>`:''}
    </button>`;
  });
  html+=`<button class="sidebar-item" onclick="openAddCourse()" style="color:var(--text3);margin-top:4px;">+ درس جدید</button>`;
  el.innerHTML=html;
  updateSidebarActive();
}

function toggleChapter(id){openChapters[id]=!openChapters[id];renderSidebar();}

function updateSidebarActive(){
  document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.remove('active'));
  const active=document.getElementById('si-'+page.replace(':','-').replace('course-','course-'));
  if(active)active.classList.add('active');
  if(page.startsWith('course:')){
    const id=page.split(':')[1];
    const el=document.getElementById('si-course-'+id);
    if(el)el.classList.add('active');
  }
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
const TITLES={dashboard:'داشبورد',review:'مرور امروز',settings:'تنظیمات'};
function goto(p){
  page=p;gradingId=null;
  const title=p.startsWith('course:')?D.courses.find(c=>c.id===p.split(':')[1])?.name??'':TITLES[p]??'';
  document.getElementById('h-title').textContent=title;
  const due=D.topics.filter(t=>t.nextReview<=today()).length;
  document.getElementById('h-sub').textContent=due>0?`${due} موضوع برای مرور`:'';
  updateSidebarActive();
  if(isMobile())closeSidebar();
  render();
}

function scrollToTopic(id){
  goto('review');
  setTimeout(()=>{const el=document.getElementById('t-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},200);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const c=document.getElementById('content');
  if(page==='dashboard')c.innerHTML=renderDashboard();
  else if(page==='review')c.innerHTML=renderReview();
  else if(page==='settings')c.innerHTML=renderSettings();
  else if(page.startsWith('course:'))c.innerHTML=renderCourse(page.split(':')[1]);
  renderSidebar();
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  const due=D.topics.filter(t=>t.nextReview<=today());
  const overdue=D.topics.filter(t=>t.nextReview<today());
  const allSc=D.topics.filter(t=>t.history.length).map(t=>tReady(t));
  const overall=allSc.length?Math.round(allSc.reduce((a,b)=>a+b,0)/allSc.length):null;

  let html=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
    <div class="stat"><div class="stat-n" style="color:${due.length>0?'#fb923c':'#4ade80'}">${due.length}</div><div class="stat-l">برای مرور</div></div>
    <div class="stat"><div class="stat-n" style="color:${rc(overall)}">${overall!==null?overall+'%':'—'}</div><div class="stat-l">آمادگی کلی</div></div>
    <div class="stat"><div class="stat-n" style="color:#f87171">${overdue.length}</div><div class="stat-l">عقب‌افتاده</div></div>
    <div class="stat"><div class="stat-n">${D.topics.length}</div><div class="stat-l">کل موضوعات</div></div>
  </div>`;

  if(due.length){
    html+=`<div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:10px;letter-spacing:0.4px;">امروز چی مرور کنم</div>`;
    due.slice(0,6).forEach(t=>{
      const c=getCrs(t),ch=getCh(t),diff=daysDiff(t.nextReview);
      html+=`<div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="goto('review')">
        <div style="display:flex;align-items:center;gap:10px;">
          ${gb(t.lastGrade)}
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.name}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:2px;">${c?c.name:''} ${ch?'/ '+ch.name:''}</div>
          </div>
          ${diff<0?`<span style="font-size:10px;color:#f87171;flex-shrink:0;">${Math.abs(diff)}روز تأخیر</span>`:`<span style="font-size:10px;color:#facc15;flex-shrink:0;">امروز</span>`}
        </div>
      </div>`;
    });
    if(due.length>6)html+=`<div style="text-align:center;font-size:12px;color:var(--text3);padding:8px;">و ${due.length-6} موضوع دیگر...</div>`;
  }

  if(D.courses.length){
    html+=`<div style="font-size:11px;font-weight:600;color:var(--text3);margin:18px 0 10px;letter-spacing:0.4px;">وضعیت دروس</div>`;

  chs.forEach(ch=>{

    const isOpen=openChapters['p_'+ch.id];
    html+=`<div class="card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="togglePageChapter('${ch.id}')">

        </div>
        <span style="font-size:13px;font-weight:700;color:${rc(r)}">${r!==null?r+'%':'—'}</span>
        <button onclick="event.stopPropagation();openEditChapter('${ch.id}')" style="color:var(--text3);font-size:16px;">✏️</button>
        <span style="color:var(--text3);font-size:14px;transition:transform 0.2s;${isOpen?'transform:rotate(90deg)':''}"}>›</span>
      </div>
      ${isOpen?`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px;">
        <div class="pbar" style="margin-bottom:10px;"><div class="pfill" style="width:${r??0}%;background:${rc(r)};"></div></div>

          const last5=t.history.slice(-5).map(h=>gb(h.grade)).join('');
          const tr=tReady(t);
          return`<div class="card" style="margin-bottom:7px;background:var(--bg3);" id="t-${t.id}">
            <div style="display:flex;align-items:flex-start;gap:9px;">
              ${gb(t.lastGrade)}
              <div style="flex:1;min-width:0;">
                <div style="font-size:14px;font-weight:500;color:var(--text);">${t.name}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;">
                  ${t.importance?ib(t.importance):''}
                  <span style="font-size:10px;color:var(--text3);">آخرین: ${relDate(lastR)}</span>
                  <span style="font-size:10px;color:${diff<=0?'#fb923c':'var(--text3)'};">بعدی: ${diff===0?'امروز':diff<0?Math.abs(diff)+' تأخیر':diff+' روز دیگر'}</span>
                </div>

// ── REVIEW ────────────────────────────────────────────────────────────────────
function renderReview(){
  const due=D.topics.filter(t=>t.nextReview<=today());
  if(!due.length)return`<div style="text-align:center;padding:60px 20px;">
    <div style="font-size:48px;margin-bottom:12px;">✓</div>
    <div style="font-size:16px;font-weight:600;color:var(--green);">برای امروز تمومه!</div>
    <div style="font-size:13px;color:var(--text3);margin-top:6px;">${D.topics.filter(t=>t.nextReview>today()).length} موضوع در پیش‌رو</div>
  </div>`;

  // Group by course
  const groups=[];
  D.courses.forEach(c=>{
    const chs=D.chapters.filter(ch=>ch.courseId===c.id);
    const tops=due.filter(t=>chs.some(ch=>ch.id===t.chapterId));
    if(tops.length)groups.push({c,tops});
  });
  const other=due.filter(t=>!getCrs(t));
  if(other.length)groups.push({c:null,tops:other});

  let html='';
  groups.forEach(({c,tops})=>{
    html+=`<div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:8px;margin-top:16px;letter-spacing:0.4px;">
      ${c?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-left:6px;"></span>${c.name}`:'سایر'}
    </div>`;
    tops.forEach(t=>{
      const ch=getCh(t),diff=daysDiff(t.nextReview);
      const last5=t.history.slice(-5).map(h=>gb(h.grade)).join('');
      const tr=tReady(t);
      html+=`<div class="card" style="margin-bottom:10px;" id="t-${t.id}">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
          ${gb(t.lastGrade)}
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;">${t.name}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px;">${ch?ch.name:''}</div>
            <div style="display:flex;gap:6px;margin-top:5px;align-items:center;flex-wrap:wrap;">
              ${last5?`<div style="display:flex;gap:3px;">${last5}</div>`:''}
              ${tr!==null?`<span style="font-size:11px;font-weight:600;color:${rc(tr)};">${tr}%</span>`:''}
              ${t.importance?ib(t.importance):''}
            </div>
            ${trendChart(t.history)}
          </div>
          ${diff<0?`<span style="font-size:10px;color:#f87171;flex-shrink:0;">${Math.abs(diff)}روز تأخیر</span>`:''}
        </div>
        <textarea class="note-ta" placeholder="یادداشت..." onchange="saveNote('${t.id}',this.value)">${t.note??''}</textarea>
        ${gradingId===t.id?gradeRow(t.id):`<button onclick="gradingId='${t.id}';render()" style="margin-top:8px;width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;">ثبت نمره</button>`}
      </div>`;
    });
  });
  return html;
}

function gradeRow(id){
  return`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
    ${Object.entries(GC).map(([g,c])=>`<button class="grade-btn" onclick="applyGrade('${id}','${g}')" style="background:${c.color}18;border:1.5px solid ${c.color};color:${c.color};">${c.l}</button>`).join('')}
    <button onclick="gradingId=null;render()" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text3);">لغو</button>
  </div>`;
}

function saveNote(id,val){D.topics=D.topics.map(t=>t.id===id?{...t,note:val}:t);sd();}
function applyGrade(id,grade){
  const cfg=GC[grade];
  D.topics=D.topics.map(t=>t.id!==id?t:{...t,lastGrade:grade,nextReview:addDays(today(),cfg.days),history:[...t.history,{date:today(),grade}]});
  gradingId=null;sd();render();flash('نمره ثبت شد','#4ade80');
}

// ── EXPORT/IMPORT ─────────────────────────────────────────────────────────────
function exportData(fmt){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`study-${today()}.${fmt}`;a.click();
  URL.revokeObjectURL(url);flash('فایل ذخیره شد');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.courses&&p.topics){D=p;sd();render();flash('داده‌ها بارگذاری شدن');}else flash('فایل معتبر نیست','#f87171');}catch{flash('خطا','#f87171');}};
  r.readAsText(f);e.target.value='';
}

  const imp=document.getElementById('sf-imp')?.value??'';
  let res=D.topics.filter(t=>{
    if(q&&!t.name.toLowerCase().includes(q))return false;
    if(grade&&t.lastGrade!==grade)return false;
    if(imp&&t.importance!==imp)return false;
    if(cId){const c=getCrs(t);if(!c||c.id!==cId)return false;}
    return true;
  });
  const el=document.getElementById('s-results');if(!el)return;
  if(!res.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3);">نتیجه‌ای یافت نشد</div>`;return;}
  el.innerHTML=res.slice(0,15).map(t=>{
    const c=getCrs(t),ch=getCh(t);
    const diff=daysDiff(t.nextReview);
    return`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="closeSearch();scrollToTopic('${t.id}')">
      ${gb(t.lastGrade)}
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.name}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;">${c?c.name:''} ${ch?'/ '+ch.name:''}</div>
      </div>
      ${t.importance?ib(t.importance):''}
      <span style="font-size:10px;color:${diff<=0?'#fb923c':'var(--text3)'};flex-shrink:0;">${diff===0?'امروز':diff<0?Math.abs(diff)+'روز تأخیر':diff+'روز دیگر'}</span>
    </div>`;
  }).join('');
}

// ── TREND CHART ───────────────────────────────────────────────────────────────
function trendChart(history){
  if(history.length<2)return'';
  const last8=history.slice(-8);
  const w=180,h=40,pad=4;
  const scores=last8.map(h=>gs(h.grade));
  const min=0,max=100;
  const pts=scores.map((s,i)=>{
    const x=pad+i*(w-pad*2)/(last8.length-1);
    const y=h-pad-(s-min)/(max-min)*(h-pad*2);
    return`${x},${y}`;
  }).join(' ');
  const lastScore=scores[scores.length-1];
  const color=lastScore>=80?'#4ade80':lastScore>=60?'#a3e635':lastScore>=40?'#facc15':lastScore>=20?'#fb923c':'#f87171';
  return`<svg width="${w}" height="${h}" style="display:block;margin-top:6px;">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
    ${scores.map((s,i)=>{
      const x=pad+i*(w-pad*2)/(last8.length-1);
      const y=h-pad-(s-min)/(max-min)*(h-pad*2);
      const c2=s>=80?'#4ade80':s>=60?'#a3e635':s>=40?'#facc15':s>=20?'#fb923c':'#f87171';
      return`<circle cx="${x}" cy="${y}" r="2.5" fill="${c2}"/>`;
    }).join('')}
  </svg>`;
}

goto('dashboard');
setTimeout(showBanner,500);
